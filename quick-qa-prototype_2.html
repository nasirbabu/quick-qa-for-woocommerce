/* ============================================
   TEMPLATES PAGE
============================================ */
.templates-content {
  padding: 36px 48px 60px;
  max-width: 1080px;
  margin: 0 auto;
}
.templates-cat-tabs {
  display: flex;
  gap: 22px;
  border-bottom: 0.5px solid var(--hairline);
  margin-bottom: 32px;
}
.templates-cat-tab {
  padding: 10px 0;
  font-size: 13px;
  color: var(--text-3);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  margin-bottom: -1px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.templates-cat-tab.active {
  color: var(--text);
  border-bottom-color: var(--coral);
  font-weight: 500;
}
.templates-cat-num { color: var(--text-4); font-size: 12px; }
.templates-cat-tab.active .templates-cat-num { color: var(--coral); }
.templates-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.tcard {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  padding: 20px 22px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
  position: relative;
}
.tcard:hover {
  border-color: #E0D8CC;
  box-shadow: var(--shadow-card);
}
.tcard:hover .tcard-actions { opacity: 1; }
.tcard-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
  gap: 12px;
}
.tcard-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  margin: 0 0 4px;
  line-height: 1.3;
}
.tcard-cat { font-size: 12px; color: var(--text-3); }
.tcard-uses {
  font-size: 12px;
  color: var(--text-2);
  flex-shrink: 0;
  text-align: right;
}
.tcard-uses b { color: var(--text); font-weight: 500; font-size: 13px; }
.tcard-uses-sub { font-size: 11px; color: var(--text-4); }
.tcard-preview {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 14px;
}
.tcard-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 12px;
  border-top: 0.5px solid var(--cream-3);
}
.tcard-meta { font-size: 12px; color: var(--text-4); }
.tcard-actions {
  opacity: 0;
  transition: opacity 0.15s;
  display: flex;
  gap: 14px;
  font-size: 12px;
  color: var(--text-3);
}
.tcard-actions span { cursor: pointer; }
.tcard-actions span:hover { color: var(--text); }
.tcard-actions .danger:hover { color: var(--red); }
.tcard-most-used { border-color: var(--gold); }
.tcard-most-used::before {
  content: 'Most used';
  position: absolute;
  top: -8px;
  left: 16px;
  background: var(--gold-soft);
  color: var(--gold-text);
  font-size: 10px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 3px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.tcard-add {
  background: var(--cream-2);
  border: 1px dashed #D4CCC2;
  border-radius: var(--r-md);
  padding: 28px 22px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 180px;
  transition: border-color 0.15s, background 0.15s;
}
.tcard-add:hover {
  border-color: var(--coral);
  background: var(--coral-soft);
}
.tcard-add-plus {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: white;
  border: 0.5px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--coral);
  margin-bottom: 12px;
  font-weight: 300;
}
.tcard-add-text {
  font-size: 13px;
  color: var(--text-2);
  font-weight: 500;
}
.tcard-add-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 4px;
}

/* ============================================
   SEARCH UX
============================================ */
.qq-search-wrap {
  position: relative;
  flex: 1;
  max-width: 380px;
  margin-left: auto;
}
.qq-search-input {
  width: 100%;
  padding: 7px 32px 7px 32px;
  font-size: 13px;
  border-radius: var(--r-md);
  border: 0.5px solid var(--hairline);
  background: white;
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.qq-search-input::placeholder { color: var(--text-4); }
.qq-search-input:focus {
  border-color: var(--coral);
  box-shadow: 0 0 0 3px rgba(255, 107, 74, 0.08);
}
.qq-search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-4);
  font-size: 13px;
  pointer-events: none;
}
.qq-search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--cream-3);
  color: var(--text-3);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 12px;
  border: none;
  padding: 0;
}
.qq-search-clear:hover { background: #D4CCC2; color: var(--text); }

/* Hint dropdown shown when search is focused but empty */
.qq-search-hint {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  width: 320px;
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  padding: 14px 16px;
  z-index: 60;
  font-size: 12px;
}
.qq-search-hint-title {
  font-size: 11px;
  color: var(--text-4);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  font-weight: 500;
}
.qq-search-hint-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 12px;
}
.qq-search-hint-list span {
  color: var(--text-2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.qq-search-hint-list span::before {
  content: '·';
  color: var(--text-4);
}
.qq-search-hint-examples {
  border-top: 0.5px solid var(--cream-3);
  padding-top: 10px;
  color: var(--text-3);
}
.qq-search-hint-chip {
  display: inline-block;
  background: var(--coral-soft);
  color: var(--coral-text);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  margin: 2px 3px 2px 0;
  cursor: pointer;
  font-family: inherit;
  border: none;
}
.qq-search-hint-chip:hover { background: var(--coral-soft-2); }

/* Highlight matched search terms in queue rows */
mark.qq-highlight {
  background: #FFF3B0;
  color: var(--text);
  padding: 0 1px;
  border-radius: 2px;
  font-weight: 500;
}

/* Empty search results state */
.qq-search-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 30px;
  text-align: center;
}
.qq-search-empty-mark {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--cream-2);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 14px;
  font-size: 20px;
  color: var(--text-3);
}
.qq-search-empty-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 6px;
}
.qq-search-empty-desc {
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 16px;
}
.qq-search-empty-clear {
  font-size: 12px;
  color: var(--coral);
  cursor: pointer;
  font-weight: 500;
}

/* ============================================
   BULK SELECT SYSTEM
============================================ */
/* Always reserve space for the checkbox so its appearance never shifts content */
.qq-row { padding-left: 44px; }

/* Row checkbox - always positioned, just hidden until hover or selection */
.qq-row-check {
  position: absolute;
  left: 16px;
  top: 16px;
  width: 16px;
  height: 16px;
  border-radius: var(--r-sm);
  border: 1.5px solid #CBC4BB;
  background: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: white;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 2;
}
.qq-row:hover .qq-row-check { opacity: 1; }
.qq-row-check.checked,
.qq-bulk-mode .qq-row-check {
  opacity: 1;
}
.qq-row-check.checked {
  background: var(--coral);
  border-color: var(--coral);
}
.qq-row.selected {
  background: var(--coral-soft);
}
.qq-row.selected:not(.active)::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--coral);
  opacity: 0.4;
}

/* Bulk action bar - replaces queue header when items selected */
.qq-bulk-bar {
  background: var(--coral-soft);
  border-bottom: 0.5px solid #FAD9CC;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
}
.qq-bulk-bar-left {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13px;
}
.qq-bulk-bar-master {
  width: 16px;
  height: 16px;
  border-radius: var(--r-sm);
  border: 1.5px solid var(--coral);
  background: var(--coral);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: white;
  flex-shrink: 0;
}
.qq-bulk-bar-master.partial {
  background: var(--coral);
  border-color: var(--coral);
}
.qq-bulk-bar-master.empty {
  background: white;
  color: white;
}
.qq-bulk-bar-count {
  color: var(--text);
  font-weight: 500;
}
.qq-bulk-bar-link {
  color: var(--coral);
  cursor: pointer;
  font-size: 12px;
}
.qq-bulk-bar-link:hover { text-decoration: underline; }
.qq-bulk-bar-actions {
  display: flex;
  gap: 6px;
}
.qq-bulk-action-btn {
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--r-md);
  border: 0.5px solid var(--hairline);
  background: white;
  color: var(--text-2);
  cursor: pointer;
  transition: color 0.1s, border-color 0.1s;
}
.qq-bulk-action-btn:hover { color: var(--text); border-color: #D4CCC2; }
.qq-bulk-action-btn.primary {
  background: var(--coral);
  color: white;
  border-color: var(--coral);
}
.qq-bulk-action-btn.primary:hover { background: var(--coral-hover); border-color: var(--coral-hover); }
.qq-bulk-action-btn.danger:hover { color: var(--red); border-color: var(--red); }

/* Selection summary panel (replaces conversation when bulk active) */
.qq-bulk-summary {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  padding: 40px;
  text-align: center;
  background: var(--cream);
}
.qq-bulk-summary-art {
  width: 96px;
  height: 96px;
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--coral-soft) 0%, var(--coral-soft-2) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
  font-size: 36px;
}
.qq-bulk-summary-num {
  font-size: 32px;
  font-weight: 500;
  color: var(--text);
  margin: 0 0 6px;
}
.qq-bulk-summary-label {
  font-size: 14px;
  color: var(--text-3);
  margin: 0 0 24px;
}
.qq-bulk-summary-card {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  padding: 18px 22px;
  max-width: 380px;
  width: 100%;
  margin-bottom: 24px;
}
.qq-bulk-summary-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 13px;
}
.qq-bulk-summary-row + .qq-bulk-summary-row { border-top: 0.5px solid var(--cream-3); }
.qq-bulk-summary-row span { color: var(--text-2); }
.qq-bulk-summary-row b { color: var(--text); font-weight: 500; }
.qq-bulk-summary-tip {
  font-size: 12px;
  color: var(--text-3);
  max-width: 320px;
  line-height: 1.5;
}

/* Filter dropdown in queue header */
.qq-queue-head { display: flex; align-items: center; gap: 12px; padding-right: 14px; }
.qq-queue-head-left { flex: 1; }
.qq-filter-dropdown {
  font-size: 12px;
  color: var(--text-3);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  gap: 4px;
  position: relative;
}
.qq-filter-dropdown:hover { background: var(--cream-2); color: var(--text); }
.qq-filter-dropdown.active { color: var(--coral); font-weight: 500; }
.qq-filter-popover {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 6px;
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  min-width: 200px;
  z-index: 50;
  overflow: hidden;
}
.qq-filter-popover-item {
  padding: 9px 14px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.qq-filter-popover-item:hover { background: var(--cream-2); }
.qq-filter-popover-item.selected {
  background: var(--coral-soft);
  color: var(--coral-text);
  font-weight: 500;
}
.qq-filter-popover-count {
  font-size: 11px;
  color: var(--text-4);
}
.qq-filter-popover-item.selected .qq-filter-popover-count { color: var(--coral); }

/* Filter chip when active */
.qq-active-filter {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background: var(--coral-soft);
  color: var(--coral-text);
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  margin-left: 6px;
}
.qq-active-filter-x {
  cursor: pointer;
  padding: 0 2px;
  opacity: 0.7;
}
.qq-active-filter-x:hover { opacity: 1; }

/* ============================================
   SETTINGS — RADIO CARDS, MULTI-SELECT, ALERTS
============================================ */
.radio-group-vertical {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}
.radio-card {
  display: flex;
  gap: 12px;
  padding: 12px 14px;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  background: white;
  cursor: pointer;
  align-items: flex-start;
  transition: border-color 0.15s, background 0.15s;
}
.radio-card:hover:not(.selected) { border-color: #D4CCC2; }
.radio-card.selected {
  border-color: var(--coral);
  background: var(--coral-soft);
}
.radio-card-circle {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1.5px solid #CBC4BB;
  flex-shrink: 0;
  margin-top: 2px;
  position: relative;
}
.radio-card.selected .radio-card-circle { border-color: var(--coral); }
.radio-card.selected .radio-card-circle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--coral);
}
.radio-card-text { flex: 1; }
.radio-card-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
.radio-card-help { font-size: 12px; color: var(--text-3); line-height: 1.5; }

/* Conditional sub-field (shown when a radio card is selected) */
.subfield {
  margin-top: 12px;
  margin-left: 28px;
  padding: 14px 16px;
  background: var(--cream-2);
  border-radius: var(--r-md);
  border-left: 2px solid var(--coral-soft-2);
}
.subfield-label {
  font-size: 12px;
  color: var(--text-2);
  font-weight: 500;
  margin-bottom: 8px;
}

/* Multi-select chip area */
.chip-multiselect {
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  background: white;
  padding: 8px 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  min-height: 36px;
  width: 100%;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: var(--coral-soft);
  color: var(--coral-text);
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
}
.chip-x {
  cursor: pointer;
  padding: 0 2px;
  opacity: 0.7;
  font-weight: 400;
}
.chip-x:hover { opacity: 1; }
.chip-input {
  flex: 1;
  min-width: 100px;
  border: none;
  outline: none;
  background: transparent;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  padding: 4px 0;
}
.chip-input::placeholder { color: var(--text-4); }

/* Textarea for blocklist/allowlist */
.textarea-setting {
  width: 100%;
  min-height: 70px;
  padding: 9px 12px;
  font-size: 13px;
  border-radius: var(--r-md);
  border: 0.5px solid var(--hairline);
  background: white;
  color: var(--text);
  font-family: inherit;
  resize: vertical;
  outline: none;
  line-height: 1.5;
}
.textarea-setting:focus { border-color: var(--coral); }

/* Banner inside settings (warning/info notes) */
.settings-banner {
  background: #FFF8EC;
  border: 0.5px solid #F5E1B5;
  border-radius: var(--r-md);
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 13px;
  color: #6B5817;
  line-height: 1.5;
  margin-bottom: 20px;
}
.settings-banner-mark {
  flex-shrink: 0;
  font-size: 14px;
  margin-top: 1px;
}
.settings-banner-body { flex: 1; }
.settings-banner.warn {
  background: var(--red-soft-2);
  border-color: #F5DCD5;
  color: #8A2D1F;
}

/* Stack a control to the next line (for fields that need full width below the label) */
.settings-field-stacked { display: block; padding: 16px 0; border-top: 0.5px solid var(--cream-3); }
.settings-field-stacked:first-of-type { border-top: none; padding-top: 0; }
.settings-field-stacked .settings-field-label { font-size: 14px; color: var(--text); margin-bottom: 4px; font-weight: 500; }
.settings-field-stacked .settings-field-help { font-size: 12px; color: var(--text-3); line-height: 1.5; margin-bottom: 12px; }

/* ============================================
   CLICKABLE NAMES (subtle link affordance)
============================================ */
.qq-clickable {
  cursor: pointer;
  transition: text-decoration-color 0.15s;
  text-decoration: underline;
  text-decoration-color: transparent;
  text-underline-offset: 2px;
}
.qq-clickable:hover {
  text-decoration-color: currentColor;
}

/* ============================================
   BACK NAVIGATION
============================================ */
.back-nav {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-3);
  cursor: pointer;
  padding: 6px 0;
  margin-bottom: 16px;
  background: none;
  border: none;
  font-family: inherit;
}
.back-nav:hover { color: var(--text); }

/* ============================================
   PROFILE PAGES (customer + product)
============================================ */
.profile-content {
  padding: 24px 40px 60px;
  max-width: 1080px;
  margin: 0 auto;
}
.profile-header {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  padding: 28px 32px;
  display: flex;
  gap: 24px;
  align-items: flex-start;
  margin-bottom: 24px;
}
.profile-avatar-large {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--cream-3);
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 500;
  flex-shrink: 0;
}
.profile-avatar-large.guest {
  background: #F5F1EB;
  color: var(--text-3);
}
.profile-avatar-large.product {
  background: linear-gradient(135deg, var(--coral-soft) 0%, var(--coral-soft-2) 100%);
  font-size: 32px;
}
.profile-header-body { flex: 1; min-width: 0; }
.profile-name {
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
  margin: 0 0 6px;
}
.profile-meta {
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.profile-meta-divider { color: var(--text-4); }
.profile-type-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1px;
}
.profile-type-pill.verified-buyer {
  background: var(--green-soft);
  color: #3B6D11;
}
.profile-type-pill.customer {
  background: var(--coral-soft);
  color: var(--coral-text);
}
.profile-type-pill.guest {
  background: var(--cream-3);
  color: var(--text-3);
}
.profile-trust-line {
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.6;
  margin-top: 6px;
}
.profile-trust-line b {
  color: var(--text);
  font-weight: 500;
}

/* Profile stats grid */
.profile-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  margin-bottom: 24px;
}
.profile-stat {
  padding: 18px 22px;
  border-right: 0.5px solid var(--cream-3);
}
.profile-stat:last-child { border-right: none; }
.profile-stat-label {
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 6px;
}
.profile-stat-num {
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
  line-height: 1;
}
.profile-stat-num.warm { color: var(--coral); }
.profile-stat-sub {
  font-size: 11px;
  color: var(--text-4);
  margin-top: 4px;
}

/* Profile section card */
.profile-section {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  padding: 22px 26px;
  margin-bottom: 20px;
}
.profile-section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 16px;
}
.profile-section-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  margin: 0;
}
.profile-section-sub {
  font-size: 12px;
  color: var(--text-3);
}

/* Profile blank state (used for guest customers) */
.profile-blank {
  text-align: center;
  padding: 24px 16px;
  color: var(--text-3);
  font-size: 13px;
  line-height: 1.6;
}
.profile-blank-mark {
  font-size: 28px;
  margin-bottom: 10px;
  opacity: 0.4;
}

/* Profile activity item */
.profile-activity-item {
  padding: 12px 0;
  border-top: 0.5px solid var(--cream-3);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
}
.profile-activity-item:first-child { border-top: none; padding-top: 0; }
.profile-activity-body { flex: 1; min-width: 0; }
.profile-activity-product {
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 4px;
}
.profile-activity-text {
  font-size: 13px;
  color: var(--text);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.profile-activity-meta {
  font-size: 11px;
  color: var(--text-4);
  flex-shrink: 0;
  text-align: right;
}
.profile-activity-meta-strong {
  color: var(--text-2);
  font-weight: 500;
  display: block;
  margin-bottom: 2px;
}

/* Themes chips on product profile */
.themes-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.theme-chip {
  background: var(--cream-2);
  border: 0.5px solid var(--hairline);
  color: var(--text-2);
  padding: 4px 12px;
  border-radius: 14px;
  font-size: 12px;
}

/* ============================================
   DIRECTORY TABLE (used for All Customers and All Products pages)
============================================ */
.directory-content {
  padding: 24px 40px 60px;
  max-width: 1080px;
  margin: 0 auto;
}
.directory-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
}
.directory-toolbar-left { font-size: 13px; color: var(--text-3); }
.directory-toolbar-right { display: flex; gap: 12px; align-items: center; }
.directory-table {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  overflow: hidden;
}
.directory-row {
  display: grid;
  gap: 16px;
  padding: 14px 22px;
  border-top: 0.5px solid var(--cream-3);
  font-size: 13px;
  align-items: center;
  cursor: pointer;
  transition: background 0.1s;
}
.directory-row:hover { background: var(--cream-2); }
.directory-row.head {
  background: var(--cream-2);
  border-top: none;
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  font-weight: 500;
  cursor: default;
  padding: 11px 22px;
}
.directory-row.head:hover { background: var(--cream-2); }
.directory-row.head span {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.directory-row.head span:hover { color: var(--text); }
.directory-row.head span.sorted { color: var(--coral); }

.directory-customers-grid { grid-template-columns: 30px 1.6fr 100px 80px 80px 1fr 120px; }
.directory-products-grid { grid-template-columns: 32px 1.6fr 100px 80px 90px 110px; }

.directory-name { color: var(--text); font-weight: 500; }
.directory-name-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.directory-num { color: var(--text-2); font-weight: 500; }
.directory-faded { color: var(--text-3); }

/* Avatar in directory (small) */
.directory-av {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--cream-3);
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
  flex-shrink: 0;
}
.directory-av.product {
  background: var(--coral-soft);
  color: var(--coral-text);
  font-size: 14px;
}
.directory-av.guest { background: var(--cream-3); color: var(--text-4); }

.directory-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-3);
}

/* ============================================
   EMAIL TEMPLATES
============================================ */
.email-list {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  overflow: hidden;
}
.email-group-label {
  background: var(--cream-2);
  padding: 8px 16px;
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
  border-top: 0.5px solid var(--cream-3);
}
.email-group-label:first-child { border-top: none; }
.email-row {
  display: grid;
  grid-template-columns: 38px 1fr 140px 70px 80px;
  gap: 16px;
  padding: 14px 16px;
  border-top: 0.5px solid var(--cream-3);
  align-items: center;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.1s;
}
.email-row:hover { background: var(--cream-2); }
.email-row.disabled { opacity: 0.55; }
.email-row.disabled:hover { opacity: 1; }
.email-row-toggle {
  position: relative;
  width: 32px;
  height: 18px;
  background: #E8E2DA;
  border-radius: 9px;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}
.email-row-toggle.on { background: var(--coral); }
.email-row-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: white;
  transition: left 0.2s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.email-row-toggle.on::after { left: 16px; }
.email-row-name {
  color: var(--text);
  font-weight: 500;
}
.email-row-subject {
  color: var(--text-3);
  font-size: 12px;
  margin-top: 2px;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.email-row-recipient {
  color: var(--text-2);
  font-size: 12px;
}
.email-row-stat {
  color: var(--text-3);
  font-size: 12px;
  text-align: right;
}
.email-row-stat b { color: var(--text); font-weight: 500; }
.email-row-edit {
  color: var(--coral);
  font-size: 12px;
  font-weight: 500;
  text-align: right;
}

/* Email editor (2-column layout) */
.email-editor {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 24px;
  margin-top: 4px;
}
.email-editor-main { min-width: 0; }
.email-editor-sidebar {
  position: sticky;
  top: 24px;
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Variable insertion sidebar */
.variable-sidebar-card {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  overflow: hidden;
}
.variable-sidebar-head {
  padding: 14px 18px;
  border-bottom: 0.5px solid var(--cream-3);
}
.variable-sidebar-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  margin: 0 0 4px;
}
.variable-sidebar-help {
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.5;
}
.variable-list {
  max-height: 300px;
  overflow-y: auto;
}
.variable-item {
  padding: 9px 18px;
  font-size: 12px;
  cursor: pointer;
  border-top: 0.5px solid var(--cream-3);
  transition: background 0.1s;
}
.variable-item:first-child { border-top: none; }
.variable-item:hover { background: var(--cream-2); }
.variable-item code {
  background: var(--coral-soft);
  color: var(--coral-text);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11px;
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-weight: 500;
  margin-right: 8px;
  white-space: nowrap;
}
.variable-item-desc {
  color: var(--text-3);
  font-size: 11px;
  margin-top: 3px;
  line-height: 1.4;
}

/* Email preview card */
.email-preview-card {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  overflow: hidden;
}
.email-preview-head {
  padding: 12px 14px;
  background: var(--cream-2);
  border-bottom: 0.5px solid var(--cream-3);
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
}
.email-preview-body {
  padding: 14px 16px;
  font-size: 12px;
  line-height: 1.55;
}
.email-preview-meta {
  font-size: 11px;
  color: var(--text-3);
  padding-bottom: 10px;
  border-bottom: 0.5px solid var(--cream-3);
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.email-preview-meta b { color: var(--text); font-weight: 500; }
.email-preview-subject {
  font-size: 14px;
  color: var(--text);
  font-weight: 500;
  margin-bottom: 8px;
  line-height: 1.4;
}
.email-preview-text {
  color: var(--text-2);
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13px;
  line-height: 1.6;
}

/* Subject line input — slightly bigger for emphasis */
.email-subject-input {
  width: 100%;
  padding: 10px 12px;
  font-size: 14px;
  border-radius: var(--r-md);
  border: 0.5px solid var(--hairline);
  background: white;
  color: var(--text);
  font-family: inherit;
  outline: none;
}
.email-subject-input:focus { border-color: var(--coral); }

.email-body-area {
  width: 100%;
  min-height: 320px;
  padding: 14px 16px;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  font-size: 14px;
  font-family: inherit;
  background: white;
  color: var(--text);
  resize: vertical;
  outline: none;
  line-height: 1.6;
}
.email-body-area:focus { border-color: var(--coral); }

/* Test email button styling */
.email-test-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  font-size: 12px;
  border-radius: var(--r-md);
  border: 0.5px solid var(--hairline);
  background: white;
  color: var(--text-2);
  cursor: pointer;
  font-family: inherit;
}
.email-test-btn:hover { color: var(--text); border-color: #D4CCC2; }

/* ============================================
   SEO — SCHEMA PREVIEW BLOCK
============================================ */
.schema-preview-wrap {
  background: #1a1f2e;
  border-radius: var(--r-md);
  overflow: hidden;
  position: relative;
}
.schema-preview-head {
  background: #232938;
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #2c3343;
}
.schema-preview-head-label {
  font-size: 11px;
  color: #8e96a8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
}
.schema-preview-head-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}
.schema-copy-btn {
  background: transparent;
  color: #b0b8c9;
  border: 1px solid #3b4255;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.schema-copy-btn:hover { background: #2c3343; color: white; }
.schema-copy-btn.copied { background: var(--coral); border-color: var(--coral); color: white; }
.schema-test-link {
  font-size: 11px;
  color: #f0997b;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.schema-test-link:hover { color: #ffb499; }
.schema-preview-body {
  padding: 14px 18px;
  color: #d4dae5;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 380px;
  overflow-y: auto;
}
.schema-key { color: #8eb6f5; }
.schema-string { color: #c5e1a5; }
.schema-number { color: #f5b078; }
.schema-bracket { color: #d4dae5; }
.schema-toggle-link {
  font-size: 12px;
  color: var(--coral);
  cursor: pointer;
  margin-top: 10px;
  display: inline-block;
}

/* Detected SEO plugin banner */
.seo-detect-banner {
  background: #FFF8EC;
  border: 0.5px solid #F5E1B5;
  border-radius: var(--r-md);
  padding: 14px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 20px;
}
.seo-detect-banner-mark {
  flex-shrink: 0;
  font-size: 16px;
  margin-top: 1px;
}
.seo-detect-banner-body {
  flex: 1;
  font-size: 13px;
  color: #6B5817;
  line-height: 1.55;
}
.seo-detect-banner-body b { color: #4a3a08; }
.seo-detect-banner-body a {
  color: var(--coral);
  cursor: pointer;
  font-weight: 500;
  margin-left: 4px;
}

/* SEO mini-stat tiles inline (used to show schema impact) */
.seo-impact-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  background: var(--cream-2);
  border: 0.5px solid var(--cream-3);
  border-radius: var(--r-md);
  margin-top: 16px;
}
.seo-impact-cell {
  padding: 14px 16px;
  border-right: 0.5px solid var(--cream-3);
}
.seo-impact-cell:last-child { border-right: none; }
.seo-impact-num {
  font-size: 18px;
  font-weight: 500;
  color: var(--text);
}
.seo-impact-label {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
}

/* ============================================
   APPEARANCE — REDESIGNED v2
   Visual swatch controls instead of verbose radio cards.
   Compact 2-column grid for related settings.
   Smaller live preview.
============================================ */
.appearance-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 28px;
  align-items: start;
}
.appearance-main { min-width: 0; }
.appearance-sidebar {
  position: sticky;
  top: 24px;
}

/* Section block — lighter than settings-card, used for grouped visual controls */
.appr-section {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  padding: 20px 22px;
  margin-bottom: 16px;
}
.appr-section-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  margin: 0 0 4px;
}
.appr-section-desc {
  font-size: 12px;
  color: var(--text-3);
  margin: 0 0 16px;
  line-height: 1.5;
}

/* Field row inside section — label + visual control on the right */
.appr-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-top: 0.5px solid var(--cream-3);
  gap: 16px;
}
.appr-row:first-of-type { border-top: none; padding-top: 4px; }
.appr-row:last-of-type { padding-bottom: 4px; }
.appr-row-label {
  font-size: 13px;
  color: var(--text);
  min-width: 0;
  flex-shrink: 0;
}

/* Visual swatch group — small clickable previews replacing radio cards */
.swatch-group {
  display: flex;
  gap: 6px;
}
.swatch-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 28px;
  border: 0.5px solid var(--hairline);
  background: white;
  cursor: pointer;
  font-size: 11px;
  color: var(--text-3);
  transition: all 0.15s;
  font-family: inherit;
  padding: 0;
}
.swatch-btn:hover { border-color: #D4CCC2; }
.swatch-btn.selected {
  border-color: var(--coral);
  background: var(--coral-soft);
  color: var(--coral-text);
  font-weight: 500;
  box-shadow: 0 0 0 2px var(--coral-soft);
}
/* Shape demos inside the swatches */
.swatch-shape {
  width: 16px;
  height: 12px;
  background: currentColor;
  opacity: 0.55;
}
.swatch-shape.sharp { border-radius: 0; }
.swatch-shape.rounded { border-radius: 3px; }
.swatch-shape.pill { border-radius: 999px; }
.swatch-shape.circle { border-radius: 50%; width: 14px; height: 14px; }
.swatch-shape.square { border-radius: 3px; width: 14px; height: 14px; }
.swatch-shape.hidden {
  background: transparent;
  border: 1.5px dashed currentColor;
  width: 14px;
  height: 14px;
  border-radius: 50%;
}
/* Card-style demos */
.swatch-card-demo {
  width: 22px;
  height: 14px;
  background: white;
  position: relative;
}
.swatch-card-demo.bordered { border: 1px solid currentColor; }
.swatch-card-demo.filled { background: currentColor; opacity: 0.4; }
.swatch-card-demo.minimal {
  background: transparent;
  border-top: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  height: 10px;
  opacity: 0.6;
}

/* Density demos — show line spacing */
.swatch-density {
  display: flex;
  flex-direction: column;
  gap: 1px;
  width: 18px;
}
.swatch-density span {
  display: block;
  height: 1.5px;
  background: currentColor;
  opacity: 0.55;
}
.swatch-density.compact span:nth-child(1) { width: 100%; }
.swatch-density.compact span:nth-child(2) { width: 75%; }
.swatch-density.compact span:nth-child(3) { width: 90%; }
.swatch-density.comfortable { gap: 3px; }
.swatch-density.comfortable span:nth-child(1) { width: 100%; }
.swatch-density.comfortable span:nth-child(2) { width: 75%; }
.swatch-density.comfortable span:nth-child(3) { width: 90%; }
.swatch-density.spacious { gap: 5px; }
.swatch-density.spacious span:nth-child(1) { width: 100%; }
.swatch-density.spacious span:nth-child(2) { width: 75%; }
.swatch-density.spacious span:nth-child(3) { width: 90%; }

/* Color swatch grid */
.color-swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.color-swatch {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.1s, border-color 0.15s;
  background-clip: padding-box;
  flex-shrink: 0;
}
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.selected {
  border-color: var(--text);
  box-shadow: 0 0 0 2px white inset;
}
.color-hex-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.color-hex-input {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 13px;
  padding: 7px 12px;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  background: white;
  width: 110px;
  outline: none;
  text-transform: uppercase;
}
.color-hex-input:focus { border-color: var(--coral); }
.color-hex-preview {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 0.5px solid var(--hairline);
}

/* Visibility toggle list — compact rows */
.visibility-list {
  display: flex;
  flex-direction: column;
}
.visibility-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-top: 0.5px solid var(--cream-3);
}
.visibility-row:first-of-type { border-top: none; }
.visibility-row-label {
  font-size: 13px;
  color: var(--text);
}

/* Custom CSS collapsible section */
.css-collapsible {
  background: var(--cream-2);
  border: 0.5px solid var(--cream-3);
  border-radius: var(--r-md);
  margin-bottom: 16px;
  overflow: hidden;
}
.css-collapsible-head {
  padding: 12px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.css-collapsible-head:hover { background: rgba(0,0,0,0.02); }
.css-collapsible-title {
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
}
.css-collapsible-sub {
  font-size: 11px;
  color: var(--text-3);
  margin-left: 8px;
}
.css-collapsible-icon {
  color: var(--text-3);
  font-size: 14px;
  transition: transform 0.2s;
}
.css-collapsible.open .css-collapsible-icon { transform: rotate(90deg); }
.css-collapsible-body {
  padding: 0 18px 18px;
  display: none;
}
.css-collapsible.open .css-collapsible-body { display: block; }

.custom-css-area {
  width: 100%;
  min-height: 140px;
  padding: 12px 14px;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  background: white;
  color: var(--text);
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px;
  line-height: 1.6;
  resize: vertical;
  outline: none;
  white-space: pre;
  overflow-x: auto;
}
.custom-css-area:focus { border-color: var(--coral); }

/* Live preview — kept smaller and more contained */
.preview-card {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  overflow: hidden;
}
.preview-card-head {
  padding: 10px 14px;
  background: var(--cream-2);
  border-bottom: 0.5px solid var(--cream-3);
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.preview-card-body {
  padding: 16px;
  background: var(--cream);
}

/* Live Q&A widget rendered with appearance settings */
.preview-widget {
  --pw-color: #FF6B4A;
  --pw-radius: 8px;
  --pw-fs-base: 13px;
  --pw-fs-small: 11px;
  --pw-pad: 12px;
  --pw-gap: 10px;
  --pw-card-bg: white;
  --pw-card-border: 0.5px solid #EFE9E2;
  font-size: var(--pw-fs-base);
  display: flex;
  flex-direction: column;
  gap: var(--pw-gap);
  font-family: var(--pw-font, inherit);
}
.preview-widget.density-compact { --pw-pad: 9px; --pw-gap: 7px; }
.preview-widget.density-spacious { --pw-pad: 16px; --pw-gap: 14px; }
.preview-widget.fs-small { --pw-fs-base: 12px; --pw-fs-small: 10px; }
.preview-widget.fs-large { --pw-fs-base: 15px; --pw-fs-small: 12px; }
.preview-widget.card-filled { --pw-card-bg: #FAF6F0; --pw-card-border: 0; }
.preview-widget.card-minimal { --pw-card-bg: transparent; --pw-card-border: 0; }

.pw-q-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--pw-fs-small);
  color: var(--text-3);
  padding-bottom: 8px;
  border-bottom: 0.5px solid var(--cream-3);
  margin-bottom: 2px;
}
.pw-ask-btn {
  background: var(--pw-color);
  color: white;
  border: none;
  padding: 5px 12px;
  border-radius: var(--pw-radius);
  font-size: var(--pw-fs-small);
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}

.pw-thread {
  background: var(--pw-card-bg);
  border: var(--pw-card-border);
  border-radius: var(--pw-radius);
  padding: var(--pw-pad);
  display: flex;
  flex-direction: column;
  gap: var(--pw-gap);
}

.pw-msg {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.pw-msg.best {
  background: linear-gradient(180deg, #FAEEDA 0%, transparent 100%);
  margin: calc(var(--pw-pad) * -0.4) calc(var(--pw-pad) * -0.4);
  padding: calc(var(--pw-pad) * 0.4);
  border-radius: var(--pw-radius);
}
.pw-av {
  flex-shrink: 0;
  width: 24px;
  height: 24px;
  background: #E8E2DA;
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 500;
}
.pw-av.shape-circle { border-radius: 50%; }
.pw-av.shape-square { border-radius: 5px; }
.pw-av.shape-hidden { display: none; }

.pw-msg-body { flex: 1; min-width: 0; }
.pw-msg-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--pw-fs-small);
  color: var(--text-3);
  margin-bottom: 3px;
  flex-wrap: wrap;
}
.pw-msg-meta b { color: var(--text); font-weight: 500; }
.pw-role {
  background: #E5F2DC;
  color: #3B6D11;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 500;
}
.pw-role.staff { background: #FCEBEB; color: #A32D2D; }
.pw-best-tag {
  background: #FAEEDA;
  color: #856404;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 500;
}
.pw-msg-text {
  color: var(--text);
  line-height: 1.5;
  font-size: var(--pw-fs-base);
}
.pw-msg-foot {
  display: flex;
  gap: 12px;
  margin-top: 5px;
  font-size: var(--pw-fs-small);
  color: var(--text-3);
}
.pw-vote {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.pw-vote-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border: 0.5px solid #D4CCC2;
  border-radius: var(--pw-radius);
  font-size: 8px;
  color: var(--text-3);
  background: white;
}
.pw-helpful {
  color: var(--pw-color);
  cursor: pointer;
}
.pw-divider {
  font-size: var(--pw-fs-small);
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 500;
  padding: 2px 0;
}

/* Preview state switcher — tabs at top of the preview card */
.preview-state-tabs {
  display: flex;
  background: var(--cream-2);
  padding: 3px;
  border-radius: 999px;
  gap: 2px;
}
.preview-state-tab {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 999px;
  cursor: pointer;
  color: var(--text-3);
  border: none;
  background: transparent;
  font-family: inherit;
  font-weight: 500;
  transition: all 0.15s;
}
.preview-state-tab:hover { color: var(--text); }
.preview-state-tab.active {
  background: white;
  color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

/* Login prompt card — shown to anonymous visitors when "logged-in only" mode is on */
.pw-login-prompt {
  background: var(--pw-card-bg);
  border: var(--pw-card-border);
  border-radius: var(--pw-radius);
  padding: calc(var(--pw-pad) * 1.4) var(--pw-pad);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.pw-login-mark {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--cream-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--pw-color);
}
.pw-login-title {
  font-size: var(--pw-fs-base);
  color: var(--text);
  font-weight: 500;
}
.pw-login-text {
  font-size: var(--pw-fs-small);
  color: var(--text-3);
  line-height: 1.5;
  max-width: 240px;
}
.pw-login-actions {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.pw-login-btn {
  background: var(--pw-color);
  color: white;
  border: none;
  padding: 6px 16px;
  border-radius: var(--pw-radius);
  font-size: var(--pw-fs-small);
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}
.pw-login-btn.secondary {
  background: transparent;
  border: 0.5px solid #D4CCC2;
  color: var(--text);
}
.pw-login-note {
  font-size: 10px;
  color: var(--text-3);
  line-height: 1.5;
  max-width: 260px;
  padding-top: 4px;
  border-top: 0.5px solid var(--cream-3);
  width: 100%;
}

/* ===========================================================================
   FRONTEND PREVIEW PAGE — WooCommerce mockup + Q&A widget + Scenario inspector
=========================================================================== */

/* Layout: product page on left, scenario inspector on right */
.fp-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 0;
  height: calc(100vh - 50px);
}

.fp-mockup-area {
  background: #f5f5f5;
  overflow-y: auto;
  padding: 24px;
}

/* Browser chrome around the product page */
.fp-browser {
  max-width: 980px;
  margin: 0 auto;
  background: white;
  border-radius: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  overflow: hidden;
}
.fp-browser-bar {
  background: #ebebeb;
  border-bottom: 1px solid #d8d8d8;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.fp-browser-dots {
  display: flex;
  gap: 6px;
}
.fp-browser-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
}
.fp-browser-dot.red { background: #FF5F57; }
.fp-browser-dot.yellow { background: #FEBC2E; }
.fp-browser-dot.green { background: #28C840; }
.fp-browser-url {
  flex: 1;
  background: white;
  border-radius: 4px;
  padding: 4px 12px;
  font-size: 12px;
  color: #555;
  font-family: ui-monospace, monospace;
  display: flex;
  align-items: center;
  gap: 6px;
}
.fp-browser-url-lock { color: #4A8C3E; font-size: 11px; }

/* Site header (fake store nav) */
.fp-site-header {
  padding: 18px 32px;
  border-bottom: 1px solid #ebebeb;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.fp-site-brand {
  font-size: 22px;
  font-weight: 700;
  color: #1f1d1a;
  letter-spacing: -0.5px;
}
.fp-site-nav {
  display: flex;
  gap: 28px;
  font-size: 13px;
  color: #555;
}
.fp-site-nav span { cursor: default; }
.fp-site-cart {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: #555;
}
.fp-cart-icon {
  font-size: 17px;
  position: relative;
}
.fp-cart-badge {
  position: absolute;
  top: -6px;
  right: -8px;
  background: #1f1d1a;
  color: white;
  font-size: 9px;
  font-weight: 600;
  border-radius: 9px;
  padding: 1px 5px;
}

/* Breadcrumb */
.fp-breadcrumb {
  padding: 14px 32px 0;
  font-size: 12px;
  color: #888;
}
.fp-breadcrumb-sep { color: #ccc; margin: 0 6px; }

/* Product page layout */
.fp-product-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 36px;
  padding: 24px 32px 32px;
}
.fp-product-gallery {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.fp-product-main-image {
  aspect-ratio: 1;
  background: linear-gradient(135deg, #F5EFE7 0%, #E8DDD0 100%);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 90px;
  color: #B8A892;
}
.fp-product-thumbs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.fp-product-thumb {
  aspect-ratio: 1;
  background: #F5EFE7;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  color: #B8A892;
  cursor: pointer;
  border: 1.5px solid transparent;
}
.fp-product-thumb.active { border-color: #1f1d1a; }
.fp-product-thumb:nth-child(2) { background: #EBE3D5; }
.fp-product-thumb:nth-child(3) { background: #DFD4C0; }
.fp-product-thumb:nth-child(4) { background: #D4C7B0; }

/* Product info column */
.fp-product-info { display: flex; flex-direction: column; gap: 14px; }
.fp-product-category {
  font-size: 11px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.fp-product-title {
  font-size: 30px;
  font-weight: 600;
  color: #1f1d1a;
  line-height: 1.2;
  margin: 0;
  letter-spacing: -0.4px;
}
.fp-product-rating {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #666;
}
.fp-product-stars { color: #F5A623; letter-spacing: 1px; }
.fp-product-price {
  font-size: 26px;
  font-weight: 600;
  color: #1f1d1a;
}
.fp-product-price-was {
  font-size: 16px;
  color: #999;
  text-decoration: line-through;
  margin-left: 8px;
  font-weight: 400;
}
.fp-product-desc {
  font-size: 14px;
  color: #555;
  line-height: 1.55;
}
.fp-product-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 4px;
}
.fp-product-option-label {
  font-size: 12px;
  color: #666;
  font-weight: 500;
}
.fp-product-option-pills {
  display: flex;
  gap: 6px;
}
.fp-option-pill {
  padding: 6px 14px;
  border: 1px solid #d8d8d8;
  border-radius: 4px;
  font-size: 12px;
  color: #1f1d1a;
  cursor: pointer;
  background: white;
}
.fp-option-pill.selected {
  border-color: #1f1d1a;
  background: #1f1d1a;
  color: white;
}
.fp-product-cta {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
.fp-qty-input {
  display: flex;
  align-items: center;
  border: 1px solid #d8d8d8;
  border-radius: 4px;
  overflow: hidden;
}
.fp-qty-btn {
  background: white;
  border: none;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 14px;
  color: #555;
}
.fp-qty-val {
  padding: 8px 14px;
  font-size: 13px;
  color: #1f1d1a;
  border-left: 1px solid #d8d8d8;
  border-right: 1px solid #d8d8d8;
  min-width: 38px;
  text-align: center;
}
.fp-add-cart {
  flex: 1;
  background: #1f1d1a;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.3px;
}
.fp-product-meta {
  font-size: 12px;
  color: #888;
  padding-top: 14px;
  border-top: 1px solid #ebebeb;
  line-height: 1.7;
}
.fp-product-meta b { color: #555; font-weight: 500; }

/* Product tabs (Description / Reviews / Q&A) */
.fp-tabs {
  border-top: 1px solid #ebebeb;
  margin: 0 32px;
  padding-top: 22px;
}
.fp-tabs-row {
  display: flex;
  gap: 28px;
  border-bottom: 1px solid #ebebeb;
  margin-bottom: 22px;
}
.fp-tab {
  padding: 10px 0;
  font-size: 13px;
  color: #666;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  font-weight: 500;
  letter-spacing: 0.2px;
}
.fp-tab:hover { color: #1f1d1a; }
.fp-tab.active {
  color: #1f1d1a;
  border-bottom-color: #1f1d1a;
}
.fp-tab-count {
  background: #f0f0f0;
  color: #666;
  padding: 1px 7px;
  border-radius: 9px;
  font-size: 10px;
  font-weight: 500;
  margin-left: 6px;
}
.fp-tab.active .fp-tab-count { background: #1f1d1a; color: white; }
.fp-tab-content {
  padding-bottom: 40px;
}

/* Q&A widget (frontend) — uses appearance CSS vars so it reacts to settings */
.qa-widget {
  --qa-color: var(--fp-color, #FF6B4A);
  --qa-radius: var(--fp-radius, 8px);
  --qa-fs-base: var(--fp-fs-base, 14px);
  --qa-fs-small: var(--fp-fs-small, 12px);
  --qa-pad: var(--fp-pad, 16px);
  --qa-gap: var(--fp-gap, 14px);
  --qa-card-bg: var(--fp-card-bg, white);
  --qa-card-border: var(--fp-card-border, 1px solid #ebebeb);
  font-size: var(--qa-fs-base);
  color: #1f1d1a;
  font-family: var(--fp-font, inherit);
}

/* Widget header — title + ask button */
.qa-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 14px;
  border-bottom: 1px solid #ebebeb;
  margin-bottom: 18px;
  gap: 14px;
}
.qa-head-info { flex: 1; min-width: 0; }
.qa-head-title {
  font-size: 17px;
  font-weight: 600;
  color: #1f1d1a;
  margin: 0 0 4px;
  letter-spacing: -0.2px;
}
.qa-head-sub {
  font-size: var(--qa-fs-small);
  color: #888;
}
.qa-ask-btn {
  background: var(--qa-color);
  color: white;
  border: none;
  padding: 9px 18px;
  border-radius: var(--qa-radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  flex-shrink: 0;
}
.qa-ask-btn:hover { filter: brightness(0.95); }
.qa-ask-btn.secondary {
  background: white;
  color: #1f1d1a;
  border: 1px solid #d8d8d8;
}

/* Operational banners (paused, no submissions, etc.) */
.qa-banner {
  padding: 12px 16px;
  border-radius: var(--qa-radius);
  font-size: 13px;
  margin-bottom: 18px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: #FFF8EC;
  color: #6B5817;
  border: 1px solid #F5E1B5;
}
.qa-banner.info { background: #EFF6FB; color: #1A547A; border-color: #C8DEEC; }

/* Sort + filter row */
.qa-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  gap: 12px;
  flex-wrap: wrap;
}
.qa-search-frontend {
  flex: 1;
  position: relative;
  min-width: 200px;
}
.qa-search-frontend input {
  width: 100%;
  padding: 8px 12px 8px 32px;
  border: 1px solid #d8d8d8;
  border-radius: var(--qa-radius);
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.qa-search-frontend input:focus { border-color: var(--qa-color); }
.qa-search-icon-frontend {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #999;
  font-size: 13px;
}
.qa-controls-right {
  display: flex;
  gap: 8px;
  align-items: center;
}
.qa-filter-pills {
  display: flex;
  gap: 4px;
  background: #f4f4f4;
  padding: 3px;
  border-radius: var(--qa-radius);
}
.qa-filter-pill {
  padding: 5px 12px;
  border-radius: var(--qa-radius);
  font-size: 12px;
  cursor: pointer;
  color: #666;
  font-weight: 500;
  border: none;
  background: transparent;
  font-family: inherit;
}
.qa-filter-pill.active {
  background: white;
  color: #1f1d1a;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}
.qa-sort-select {
  padding: 6px 10px;
  border: 1px solid #d8d8d8;
  border-radius: var(--qa-radius);
  font-size: 12px;
  background: white;
  cursor: pointer;
  font-family: inherit;
}

/* Question thread (front-end) */
.qa-thread {
  background: var(--qa-card-bg);
  border: var(--qa-card-border);
  border-radius: var(--qa-radius);
  padding: var(--qa-pad);
  margin-bottom: var(--qa-gap);
}
.qa-thread.expanded { border-color: var(--qa-color); }

.qa-q-row {
  display: flex;
  gap: 10px;
  cursor: pointer;
  align-items: flex-start;
}
.qa-av {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  background: #E8E2DA;
  color: #555;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 500;
}
.qa-av.shape-circle { border-radius: 50%; }
.qa-av.shape-square { border-radius: 6px; }
.qa-av.shape-hidden { display: none; }
.qa-av.staff { background: #FFE4D8; color: #993C1D; }
.qa-av.verified { background: #E5F2DC; color: #3B6D11; }

.qa-q-body { flex: 1; min-width: 0; }
.qa-q-meta {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: var(--qa-fs-small);
  color: #888;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.qa-q-meta b { color: #1f1d1a; font-weight: 500; }
.qa-role {
  background: #f0f0f0;
  color: #555;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 500;
}
.qa-role.staff { background: #FCEBEB; color: #A32D2D; }
.qa-role.verified { background: #E5F2DC; color: #3B6D11; }
.qa-q-text {
  color: #1f1d1a;
  font-size: var(--qa-fs-base);
  line-height: 1.5;
}
.qa-q-foot {
  display: flex;
  gap: 16px;
  margin-top: 8px;
  align-items: center;
}
.qa-vote-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: white;
  border: 1px solid #d8d8d8;
  padding: 4px 10px;
  border-radius: var(--qa-radius);
  font-size: var(--qa-fs-small);
  color: #555;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.qa-vote-btn:hover { border-color: #b0b0b0; }
.qa-vote-btn.voted {
  background: var(--qa-color);
  color: white;
  border-color: var(--qa-color);
}
.qa-foot-link {
  font-size: var(--qa-fs-small);
  color: #888;
  cursor: pointer;
}
.qa-foot-link:hover { color: #555; }
.qa-foot-meta {
  font-size: var(--qa-fs-small);
  color: #888;
  margin-left: auto;
}

/* Answers in thread */
.qa-answers {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid #ebebeb;
  display: flex;
  flex-direction: column;
  gap: var(--qa-gap);
}
.qa-answer-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #888;
  margin-bottom: 4px;
}
.qa-answer {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: var(--qa-radius);
}
.qa-answer.best {
  background: linear-gradient(180deg, #FAEEDA 0%, transparent 100%);
}
.qa-answer-body { flex: 1; min-width: 0; }
.qa-best-tag {
  background: #FAEEDA;
  color: #856404;
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.qa-helpful {
  font-size: var(--qa-fs-small);
  color: var(--qa-color);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.qa-helpful.voted::before { content: '✓ '; }
.qa-helpful-count { color: #888; }

/* Follow-up section */
.qa-followup {
  margin-top: 10px;
  padding-left: 14px;
  border-left: 2px solid #ebebeb;
}
.qa-followup-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: var(--qa-fs-small);
  color: var(--qa-color);
  cursor: pointer;
  margin-top: 8px;
  font-weight: 500;
}

/* Ask form (inline) */
.qa-ask-form {
  background: #FAFAF8;
  border: 1px solid #ebebeb;
  border-radius: var(--qa-radius);
  padding: 18px;
  margin-bottom: 18px;
}
.qa-ask-form-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 4px;
}
.qa-ask-form-sub {
  font-size: 12px;
  color: #888;
  margin-bottom: 14px;
}
.qa-ask-form-field {
  margin-bottom: 12px;
}
.qa-ask-form-field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: #555;
  margin-bottom: 5px;
}
.qa-ask-form-field input,
.qa-ask-form-field textarea {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid #d8d8d8;
  border-radius: var(--qa-radius);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  resize: vertical;
}
.qa-ask-form-field input:focus,
.qa-ask-form-field textarea:focus { border-color: var(--qa-color); }
.qa-ask-form-field textarea {
  min-height: 100px;
}
.qa-form-counter {
  font-size: 11px;
  color: #888;
  text-align: right;
  margin-top: 4px;
}
.qa-form-counter.warn { color: #C66; }
.qa-form-counter.error { color: #A32D2D; font-weight: 500; }
.qa-form-error {
  font-size: 12px;
  color: #A32D2D;
  margin-top: 6px;
  padding: 6px 10px;
  background: #FCEBEB;
  border-radius: var(--qa-radius);
}
.qa-form-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
}
.qa-form-submit {
  background: var(--qa-color);
  color: white;
  border: none;
  padding: 9px 22px;
  border-radius: var(--qa-radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}
.qa-form-submit:disabled {
  background: #ccc;
  cursor: not-allowed;
}
.qa-form-cancel {
  font-size: 13px;
  color: #888;
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
  padding: 0;
}
.qa-recaptcha {
  background: white;
  border: 1px solid #d8d8d8;
  border-radius: var(--qa-radius);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: #555;
  margin-bottom: 12px;
}
.qa-recaptcha-check {
  width: 22px;
  height: 22px;
  border: 1.5px solid #c0c0c0;
  border-radius: 2px;
  flex-shrink: 0;
}
.qa-recaptcha-logo {
  margin-left: auto;
  font-size: 10px;
  color: #888;
  text-align: right;
  line-height: 1.3;
}

/* Submission confirmation (replaces form after submit) */
.qa-confirm {
  background: #E5F2DC;
  border: 1px solid #C5E0AC;
  border-radius: var(--qa-radius);
  padding: 18px 22px;
  margin-bottom: 18px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}
.qa-confirm.pending {
  background: #FFF8EC;
  border-color: #F5E1B5;
}
.qa-confirm-mark {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #6A8E3F;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.qa-confirm.pending .qa-confirm-mark { background: #C09525; }
.qa-confirm-body { flex: 1; }
.qa-confirm-title {
  font-size: 14px;
  font-weight: 600;
  color: #3B6D11;
  margin-bottom: 4px;
}
.qa-confirm.pending .qa-confirm-title { color: #6B5817; }
.qa-confirm-text {
  font-size: 13px;
  color: #555;
  line-height: 1.5;
}

/* Login prompt (anonymous user wants to ask but login required) */
.qa-login-prompt {
  background: white;
  border: 1px solid #ebebeb;
  border-radius: var(--qa-radius);
  padding: 32px 22px;
  text-align: center;
  margin-bottom: 18px;
}
.qa-login-mark {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #FAFAF8;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
  font-size: 22px;
  color: var(--qa-color);
}
.qa-login-title {
  font-size: 16px;
  font-weight: 600;
  color: #1f1d1a;
  margin-bottom: 6px;
}
.qa-login-text {
  font-size: 13px;
  color: #666;
  max-width: 320px;
  margin: 0 auto 16px;
  line-height: 1.5;
}
.qa-login-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.qa-login-btn {
  padding: 8px 18px;
  border-radius: var(--qa-radius);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  border: none;
}
.qa-login-btn.primary {
  background: var(--qa-color);
  color: white;
}
.qa-login-btn.secondary {
  background: white;
  color: #1f1d1a;
  border: 1px solid #d8d8d8;
}
.qa-login-note {
  font-size: 11px;
  color: #888;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid #ebebeb;
  max-width: 360px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.5;
}

/* Empty states */
.qa-empty {
  text-align: center;
  padding: 50px 20px;
  color: #888;
}
.qa-empty-mark {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #f4f4f4;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
  font-size: 24px;
}
.qa-empty-title {
  font-size: 14px;
  font-weight: 500;
  color: #1f1d1a;
  margin-bottom: 6px;
}

/* Pagination */
.qa-load-more {
  text-align: center;
  padding: 14px 0;
  margin-top: 6px;
}
.qa-load-more-btn {
  background: white;
  border: 1px solid #d8d8d8;
  padding: 8px 22px;
  border-radius: var(--qa-radius);
  font-size: 13px;
  color: #555;
  cursor: pointer;
  font-family: inherit;
}

/* Flag modal (lives within product page) */
.qa-flag-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  border-radius: 8px;
}
.qa-flag-modal {
  background: white;
  border-radius: 8px;
  padding: 22px 26px;
  max-width: 380px;
  box-shadow: 0 10px 32px rgba(0,0,0,0.18);
}
.qa-flag-modal-title {
  font-size: 16px;
  font-weight: 600;
  margin: 0 0 6px;
}
.qa-flag-modal-sub {
  font-size: 12px;
  color: #888;
  margin-bottom: 16px;
}
.qa-flag-reasons {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 16px;
}
.qa-flag-reason {
  padding: 10px 12px;
  border: 1px solid #ebebeb;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  background: white;
}

.import-trow {

.import-trow.head {

}

.import-status-ok {

  height: 16px;

}

.import-foot {

}

.modal-overlay {

}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.modal {

}
@keyframes slideUp {
  from { transform: translateY(8px); opacity: 0; }

}
.modal-head { padding: 24px 28px 18px; }
.modal-icon {

  align-items: center;
  justify-content: center;
  margin-bottom: 16px;
  font-size: 20px;
}
.modal-title {
  font-size: 18px;
  font-weight: 500;
  color: var(--text);
  margin: 0 0 6px;
}
.modal-desc {

.modal-checkbox-row {

  align-items: center;

.modal-foot {

let state = JSON.parse(JSON.stringify(initialState));

// ---------- ROUTER ----------
function setPage(page) {
  state.currentPage = page;
  state.editingTemplateId = null;
  document.querySelectorAll('.plugin-nav-item, .plugin-nav-pro').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  render();
}

document.querySelectorAll('.plugin-nav-item, .plugin-nav-pro').forEach(el => {
  el.addEventListener('click', () => setPage(el.dataset.page));
});

// ---------- TOAST ----------
function showToast(message) {
  const root = document.getElementById('toast-root');
  root.innerHTML = '';
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = message;
  root.appendChild(t);
  setTimeout(() => {
    t.classList.add('fade-out');
    setTimeout(() => t.remove(), 250);
  }, 2400);
}

// ---------- MODAL ----------
function openModal(html) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay" id="modal-overlay">${html}</div>`;
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') closeModal();
  });
}
function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
}

// ---------- HELPERS ----------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* Wrap a customer/author name in a clickable span for profile navigation */
function renderClickableName(name) {
  if (!name || name === 'Anonymous' || name === 'Store team') return escapeHtml(name);
  return `<span class="qq-clickable" data-action="open-customer" data-customer="${escapeHtml(name)}">${escapeHtml(name)}</span>`;
}

/* ---------- Profile / directory navigation helpers ---------- */
function navigateToCustomer(name, origin) {
  state.viewingCustomer = name;
  state.navigationOrigin = origin || 'all-qa';
  state.currentPage = 'customer-profile';
  render();
}

function navigateToProduct(name, origin) {
  state.viewingProduct = name;
  state.navigationOrigin = origin || 'all-qa';
  state.currentPage = 'product-profile';
  render();
}

function navigateBack() {
  const origin = state.navigationOrigin || 'all-qa';
  state.viewingCustomer = null;
  state.viewingProduct = null;
  state.navigationOrigin = null;
  state.currentPage = origin;
  render();
}

/* Get a customer profile object — synthesizes a guest profile if none exists */
function getCustomerProfile(name) {
  const profile = state.customerProfiles[name];
  if (profile) return profile;
  // Guest customer fallback
  return {
    name: name,
    email: '',
    avatar: name.split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase(),
    type: 'guest',
    memberSince: null,
    lastActive: null,
    stats: null,
    orders: null,
    recentProducts: [],
    flags: { received: 0, rejected: 0 },
    isGuest: true,
  };
}

/* Aggregate Q&A history for a customer across all questions */
function getCustomerQAHistory(name) {
  const asked = [];
  const answered = [];
  state.questions.forEach(q => {
    if (q.customer === name) asked.push(q);
    if (q.pendingAnswer && q.pendingAnswer.author === name) {
      answered.push({ question: q, answer: q.pendingAnswer, status: 'pending' });
    }
    if (q.answers) {
      q.answers.forEach(a => {
        if (a.author === name) answered.push({ question: q, answer: a, status: 'published' });
      });
    }
  });
  return { asked, answered };
}

/* Aggregate Q&A activity for a single product */
function getProductQAHistory(productName) {
  const all = state.questions.filter(q => q.product === productName);
  const askersMap = {};
  const answerersMap = {};
  all.forEach(q => {
    if (q.customer) {
      askersMap[q.customer] = (askersMap[q.customer] || 0) + 1;
    }
    if (q.answers) {
      q.answers.forEach(a => {
        if (a.role !== 'staff') {
          answerersMap[a.author] = (answerersMap[a.author] || 0) + 1;
        }
      });
    }
    if (q.pendingAnswer && q.pendingAnswer.role !== 'staff') {
      answerersMap[q.pendingAnswer.author] = (answerersMap[q.pendingAnswer.author] || 0) + 1;
    }
  });
  const topAskers = Object.entries(askersMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const topAnswerers = Object.entries(answerersMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return { all, topAskers, topAnswerers };
}

/* Aggregate customer activity for the directory */
function getAllCustomersForDirectory() {
  // Start with profiled customers
  const map = {};
  Object.values(state.customerProfiles).forEach(p => {
    map[p.name] = {
      ...p,
      // Compute live counts from current questions data
      computedAsked: 0,
      computedAnswered: 0,
    };
  });

  // Add any customers found in questions data who don't have profiles (guest)
  state.questions.forEach(q => {
    if (q.customer && q.customer !== 'Anonymous') {
      if (!map[q.customer]) {
        map[q.customer] = {
          name: q.customer,
          avatar: q.customer.split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase(),
          type: q.role === 'guest' ? 'guest' : 'customer',
          isGuest: q.role === 'guest',
          memberSince: null,
          lastActive: q.time,
          stats: null,
          orders: null,
          recentProducts: [],
          computedAsked: 0,
          computedAnswered: 0,
        };
      }
      map[q.customer].computedAsked = (map[q.customer].computedAsked || 0) + 1;
    }
    if (q.pendingAnswer && q.pendingAnswer.author && map[q.pendingAnswer.author]) {
      map[q.pendingAnswer.author].computedAnswered = (map[q.pendingAnswer.author].computedAnswered || 0) + 1;
    }
    if (q.answers) {
      q.answers.forEach(a => {
        if (a.role !== 'staff' && map[a.author]) {
          map[a.author].computedAnswered = (map[a.author].computedAnswered || 0) + 1;
        }
      });
    }
  });

  return Object.values(map);
}

/* Aggregate product activity for the directory */
function getAllProductsForDirectory() {
  const profiles = Object.values(state.productProfiles);
  // Augment with live computed counts
  return profiles.map(p => {
    const live = state.questions.filter(q => q.product === p.name);
    const liveAnswered = live.filter(q => q.tab === 'answered').length;
    const liveUnanswered = live.filter(q => q.tab === 'pending-q' || q.tab === 'pending-a').length;
    return {
      ...p,
      liveQuestionCount: live.length || p.stats.totalQuestions,
      liveAnswered: liveAnswered || p.stats.answered,
      liveUnanswered: liveUnanswered || p.stats.unanswered,
    };
  });
}

function getQuestionsForTab(tab) {
  let items;
  if (tab === 'all') items = state.questions;
  else if (tab === 'rejected') items = [];
  else items = state.questions.filter(q => q.tab === tab);

  // Apply product filter
  if (state.productFilter) {
    items = items.filter(q => q.product === state.productFilter);
  }

  // Apply search query (matches customer name, product name, question text, or any answer text)
  const q = state.searchQuery.trim().toLowerCase();
  if (q) {
    items = items.filter(item => {
      const haystacks = [
        item.customer || '',
        item.product || '',
        item.text || '',
      ];
      if (item.pendingAnswer) {
        haystacks.push(item.pendingAnswer.text || '');
        haystacks.push(item.pendingAnswer.author || '');
      }
      if (item.answers) {
        item.answers.forEach(a => {
          haystacks.push(a.text || '');
          haystacks.push(a.author || '');
        });
      }
      if (item.followups) {
        item.followups.forEach(f => {
          haystacks.push(f.text || '');
          haystacks.push(f.author || '');
        });
      }
      return haystacks.some(h => h.toLowerCase().includes(q));
    });
  }

  return items;
}

// Wrap matches in <mark> for visual highlight, escaping the rest
function highlightMatch(text) {
  const q = state.searchQuery.trim();
  if (!q) return escapeHtml(text);
  const safeText = String(text);
  // Escape regex special chars in query
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${escaped})`, 'gi');
  // Split on matches; escape each piece, wrap matches in <mark>
  return safeText.split(re).map(part => {
    if (part.toLowerCase() === q.toLowerCase()) {
      return `<mark class="qq-highlight">${escapeHtml(part)}</mark>`;
    }
    return escapeHtml(part);
  }).join('');
}

function getProductsInCurrentTab() {
  let items;
  if (state.currentTab === 'all') items = state.questions;
  else if (state.currentTab === 'rejected') items = [];
  else items = state.questions.filter(q => q.tab === state.currentTab);

  const counts = {};
  items.forEach(q => { counts[q.product] = (counts[q.product] || 0) + 1; });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}

function getTabCounts() {
  return {
    all: state.questions.length,
    'pending-q': state.questions.filter(q => q.tab === 'pending-q').length,
    'pending-a': state.questions.filter(q => q.tab === 'pending-a').length,
    flagged: state.questions.filter(q => q.tab === 'flagged').length,
    answered: state.questions.filter(q => q.tab === 'answered').length,
    rejected: 13,
  };
}

function getRoleLabel(role) {
  return ({
    'staff': 'Staff',
    'verified-buyer': 'Verified buyer',
    'community': 'Community',
    'customer': 'Customer',
    'guest': 'Guest',
  })[role] || 'Customer';
}

function getRoleClass(role) {
  if (role === 'staff') return 'qq-msg-role-staff';
  if (role === 'verified-buyer') return 'qq-msg-role-buyer';
  return 'qq-msg-role';
}

/* ===========================================================================
   RENDER — TOP DISPATCH
=========================================================================== */
function render() {
  const root = document.getElementById('content');
  switch (state.currentPage) {
    case 'all-qa':    root.innerHTML = renderAllQA(); attachAllQAEvents(); break;
    case 'templates':
      if (state.editingTemplateId) {
        root.innerHTML = renderTemplateEditor();
        attachTemplateEditorEvents();
      } else {
        root.innerHTML = renderTemplates();
        attachTemplatesEvents();
      }
      break;
    case 'analytics': root.innerHTML = renderAnalytics(); attachAnalyticsEvents(); break;
    case 'settings':  root.innerHTML = renderSettings(); attachSettingsEvents(); break;
    case 'docs':      root.innerHTML = renderDocs(); break;
    case 'pro':       root.innerHTML = renderPro(); break;
    case 'import':    root.innerHTML = renderImport(); attachImportEvents(); break;
    case 'customers-directory': root.innerHTML = renderCustomersDirectory(); attachCustomersDirectoryEvents(); break;
    case 'products-directory':  root.innerHTML = renderProductsDirectory(); attachProductsDirectoryEvents(); break;
    case 'customer-profile':    root.innerHTML = renderCustomerProfile(); attachProfileEvents(); break;
    case 'product-profile':     root.innerHTML = renderProductProfile(); attachProfileEvents(); break;
    case 'frontend-preview':    root.innerHTML = renderFrontendPreview(); attachFrontendPreviewEvents(); break;
  }
}

/* ===========================================================================
   ALL Q&A PAGE
=========================================================================== */
function renderAllQA() {
  const counts = getTabCounts();
  const items = getQuestionsForTab(state.currentTab);
  const isEmpty = items.length === 0;
  const hasSearch = state.searchQuery.trim().length > 0;
  const bulkMode = state.selectedIds.length > 0;
  let activeItem = items.find(q => q.id === state.selectedItemId);
  if (!activeItem && items.length > 0) {
    activeItem = items[0];
    state.selectedItemId = activeItem.id;
  }

  return `
    <div class="qq-top">
      <div class="qq-top-left">
        <span class="qq-page-label">All Q&amp;A</span>
      </div>
      <div class="qq-search-wrap">

        <input
          class="qq-search-input"
          id="qq-search-input"
          placeholder="Search questions, customers, products"
          value="${escapeHtml(state.searchQuery)}"
          autocomplete="off"
        />
        <button class="qq-search-clear" id="qq-search-clear" style="display: ${state.searchQuery ? 'flex' : 'none'};">×</button>
        <div class="qq-search-hint" id="qq-search-hint" style="display: none;" onclick="event.stopPropagation()">
          <div class="qq-search-hint-title">Search across</div>
          <div class="qq-search-hint-list">
            <span>Question text</span>
            <span>Customer names</span>
            <span>Product names</span>
            <span>Answer text</span>
          </div>
          <div class="qq-search-hint-examples">
            Try:
            <button class="qq-search-hint-chip" data-search-example="battery">battery</button>
            <button class="qq-search-hint-chip" data-search-example="Sarah">Sarah</button>
            <button class="qq-search-hint-chip" data-search-example="Yoga Mat">Yoga Mat</button>
            <button class="qq-search-hint-chip" data-search-example="waterproof">waterproof</button>
          </div>
        </div>
      </div>
    </div>

    <div class="qq-tabs">
      <div class="qq-tab ${state.currentTab==='all'?'active':''}" data-tab="all">All <span class="qq-tab-num">${counts.all}</span></div>
      <div class="qq-tab ${state.currentTab==='pending-q'?'active':''}" data-tab="pending-q">Pending questions <span class="qq-tab-num">${counts['pending-q']}</span></div>
      <div class="qq-tab ${state.currentTab==='pending-a'?'active':''}" data-tab="pending-a">Pending answers <span class="qq-tab-num">${counts['pending-a']}</span></div>
      <div class="qq-tab ${state.currentTab==='flagged'?'active':''} ${counts.flagged>0?'qq-tab-warn':''}" data-tab="flagged">Flagged <span class="qq-tab-num">${counts.flagged}</span></div>
      <div class="qq-tab ${state.currentTab==='answered'?'active':''}" data-tab="answered">Answered <span class="qq-tab-num">${counts.answered}</span></div>

    </div>
