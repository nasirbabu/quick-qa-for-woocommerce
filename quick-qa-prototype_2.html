}

// Renders just the inside of qq-body (queue + conversation) — used for both
// initial render and incremental updates that don't touch the search input
function renderAllQABodyInner() {
  const items = getQuestionsForTab(state.currentTab);
  const isEmpty = items.length === 0;
  const hasSearch = state.searchQuery.trim().length > 0;
  const bulkMode = state.selectedIds.length > 0;
  let activeItem = items.find(q => q.id === state.selectedItemId);
  if (!activeItem && items.length > 0) {
    activeItem = items[0];
    state.selectedItemId = activeItem.id;
  }

  const queueHtml = isEmpty && hasSearch
    ? renderSearchEmptyQueue()
    : (isEmpty ? renderEmptyQueue() : renderQueue(items, activeItem, bulkMode));

  const convHtml = bulkMode
    ? renderBulkSummary(items)
    : (isEmpty
        ? (hasSearch ? renderSearchEmptyConv() : renderEmptyConversation())
        : renderConversation(activeItem));

  return queueHtml + convHtml;
}

// Update only the queue + conversation panes, leaving the search input alone.
// Called by search input as the user types — re-rendering the whole page would
// destroy the input mid-keystroke.
function updateAllQABody() {
  const counts = getTabCounts();
  const body = document.getElementById('qq-body');
  if (!body) return;

  // Update tab counts and "results for X" label by re-rendering header text
  const tabEls = document.querySelectorAll('.qq-tab');
  const countsByTab = ['all','pending-q','pending-a','flagged','answered','rejected'];
  tabEls.forEach((el, i) => {
    const num = el.querySelector('.qq-tab-num');
    if (num) num.textContent = counts[countsByTab[i]];
  });

  // Replace just the body content
  body.innerHTML = renderAllQABodyInner();

  // Re-attach event listeners for the new body content
  attachQueueAndConvEvents();
}

// Extracted: events that live inside qq-body (rows, conversation actions, filter)
function attachQueueAndConvEvents() {
  // Customer/product name clicks (inside queue rows)
  document.querySelectorAll('[data-action="open-customer"]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      navigateToCustomer(el.dataset.customer, 'all-qa');
    });
  });
  document.querySelectorAll('[data-action="open-product"]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      navigateToProduct(el.dataset.product, 'all-qa');
    });
  });

  // Queue rows
  document.querySelectorAll('.qq-row').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="toggle-row-select"]')) return;
      if (e.target.closest('[data-action="open-customer"]')) return;
      if (e.target.closest('[data-action="open-product"]')) return;
      if (state.selectedIds.length > 0) {
        toggleRowSelect(el.dataset.itemId);
        return;
      }
      state.selectedItemId = el.dataset.itemId;
      updateAllQABody();
    });
  });

  // Row checkbox
  document.querySelectorAll('[data-action="toggle-row-select"]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleRowSelect(el.dataset.itemId);
    });
  });

  // Bulk bar actions
  document.querySelector('[data-action="toggle-select-all"]')?.addEventListener('click', toggleSelectAll);
  document.querySelector('[data-action="select-all-in-tab"]')?.addEventListener('click', selectAllInTab);
  document.querySelector('[data-action="clear-selection"]')?.addEventListener('click', clearSelection);
  document.querySelector('[data-action="bulk-approve"]')?.addEventListener('click', () => bulkAction('approve'));
  document.querySelector('[data-action="bulk-approve-answers"]')?.addEventListener('click', () => bulkAction('approve-answer'));
  document.querySelector('[data-action="bulk-reject"]')?.addEventListener('click', () => openBulkRejectModalForSelected());
  document.querySelector('[data-action="bulk-delete"]')?.addEventListener('click', () => bulkAction('delete'));
  document.querySelector('[data-action="bulk-dismiss"]')?.addEventListener('click', () => bulkAction('dismiss'));

  // Filter dropdown
  const filterDD = document.querySelector('[data-action="toggle-filter"]');
  if (filterDD) {
    filterDD.addEventListener('click', (e) => {
      e.stopPropagation();
      state.filterPopoverOpen = !state.filterPopoverOpen;
      updateAllQABody();
    });
  }
  document.querySelectorAll('[data-action="set-filter"]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      state.productFilter = el.dataset.product || null;
      state.filterPopoverOpen = false;
      const items = getQuestionsForTab(state.currentTab);
      if (items.length > 0 && !items.find(q => q.id === state.selectedItemId)) {
        state.selectedItemId = items[0].id;
      }
      updateAllQABody();
    });
  });
  document.querySelector('[data-action="clear-filter"]')?.addEventListener('click', (e) => {
    e.stopPropagation();
    state.productFilter = null;
    updateAllQABody();
  });

  // Empty-state clear search link
  document.getElementById('qq-search-empty-clear')?.addEventListener('click', () => {
    state.searchQuery = '';
    const input = document.getElementById('qq-search-input');
    if (input) input.value = '';
    updateAllQABody();
  });

  // Conversation actions
  const conv = document.querySelector('.qq-conv');
  if (conv) {
    conv.addEventListener('click', (e) => {
      const action = e.target.dataset.action;
      if (!action) return;
      handleConvAction(action, e.target);
    });

    const composer = document.getElementById('composer-text');
    if (composer) {
      composer.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          const item = state.questions.find(q => q.id === state.selectedItemId);
          if (item.status === 'pending') publishAnswer();
          else if (item.status === 'answered') publishReply();
        }
      });
    }
  }
}

function renderQueue(items, activeItem, bulkMode) {
  const hasSearch = state.searchQuery.trim().length > 0;
  const tabLabels = {
    'all': `${items.length} items`,
    'pending-q': `${items.length} questions`,
    'pending-a': `${items.length} answers awaiting review`,
    'flagged': `${items.length} flagged · auto-hidden`,
    'answered': `${items.length} answered`,
    'rejected': `${items.length} rejected`,
  };
  const headerLabel = hasSearch
    ? `${items.length} ${items.length === 1 ? 'result' : 'results'} for "${escapeHtml(state.searchQuery)}"`
    : tabLabels[state.currentTab];

  const products = getProductsInCurrentTab();
  const filterActive = !!state.productFilter;
  const filterLabel = state.productFilter || 'All products';

  return `
    <div class="qq-queue ${bulkMode ? 'qq-bulk-mode' : ''}">
      ${bulkMode ? renderBulkBar(items) : `
        <div class="qq-queue-head">
          <div class="qq-queue-head-left">
            <span>${headerLabel}</span>
            ${filterActive ? `<span class="qq-active-filter">${escapeHtml(state.productFilter)} <span class="qq-active-filter-x" data-action="clear-filter">×</span></span>` : ''}
          </div>
          <div class="qq-filter-dropdown ${filterActive ? 'active' : ''}" data-action="toggle-filter">
            ${filterActive ? '✓ Filtered' : 'Filter ▾'}
            ${state.filterPopoverOpen ? renderFilterPopover(products) : ''}
          </div>
          <div class="qq-filter-dropdown">Sort ▾</div>
        </div>
      `}
      <div class="qq-queue-list">
        ${items.map(item => renderQueueRow(item, activeItem && item.id === activeItem.id, bulkMode)).join('')}
      </div>
      <div class="qq-page-foot">
        <span>Page 1 of 1</span>
        <span>Prev   Next</span>
      </div>
    </div>
  `;
}

function renderFilterPopover(products) {
  return `
    <div class="qq-filter-popover" id="filter-popover" onclick="event.stopPropagation()">
      <div class="qq-filter-popover-item ${!state.productFilter ? 'selected' : ''}" data-action="set-filter" data-product="">
        All products
        <span class="qq-filter-popover-count">${getQuestionsForTab(state.currentTab).length + (state.productFilter ? state.questions.filter(q => q.tab === state.currentTab && q.product !== state.productFilter).length : 0)}</span>
      </div>
      ${products.map(([name, count]) => `
        <div class="qq-filter-popover-item ${state.productFilter === name ? 'selected' : ''}" data-action="set-filter" data-product="${escapeHtml(name)}">
          ${escapeHtml(name)}
          <span class="qq-filter-popover-count">${count}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderBulkBar(items) {
  const selectedCount = state.selectedIds.length;
  const totalInTab = items.length;
  const allSelected = selectedCount === totalInTab && totalInTab > 0;
  const partial = selectedCount > 0 && selectedCount < totalInTab;

  // Determine which actions to show based on current tab
  const actions = [];
  if (state.currentTab === 'pending-q') {
    actions.push({ key: 'bulk-approve', label: 'Approve', primary: true });
    actions.push({ key: 'bulk-reject', label: 'Reject', danger: true });
  } else if (state.currentTab === 'pending-a') {
    actions.push({ key: 'bulk-approve-answers', label: 'Approve', primary: true });
    actions.push({ key: 'bulk-reject', label: 'Reject', danger: true });
  } else if (state.currentTab === 'flagged') {
    actions.push({ key: 'bulk-dismiss', label: 'Dismiss flags' });
    actions.push({ key: 'bulk-delete', label: 'Delete', danger: true });
  } else {
    actions.push({ key: 'bulk-delete', label: 'Delete', danger: true });
  }

  return `
    <div class="qq-bulk-bar">
      <div class="qq-bulk-bar-left">
        <div class="qq-bulk-bar-master ${allSelected ? '' : (partial ? 'partial' : 'empty')}" data-action="toggle-select-all">
          ${allSelected ? '✓' : (partial ? '−' : '')}
        </div>
        <span class="qq-bulk-bar-count">${selectedCount} selected</span>
        ${!allSelected ? `<span class="qq-bulk-bar-link" data-action="select-all-in-tab">Select all ${totalInTab}</span>` : ''}
        <span class="qq-bulk-bar-link" data-action="clear-selection">Clear</span>
      </div>
      <div class="qq-bulk-bar-actions">
        ${actions.map(a => `
          <button class="qq-bulk-action-btn ${a.primary ? 'primary' : ''} ${a.danger ? 'danger' : ''}" data-action="${a.key}">
            ${a.label}
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function renderQueueRow(item, isActive, bulkMode) {
  const isSelected = state.selectedIds.includes(item.id);
  const showActiveStyling = isActive && !bulkMode;
  const priDot = showActiveStyling ? '<span class="qq-pri"></span>' : '';
  let footExtra = '';

  if (item.status === 'flagged') {
    footExtra = `<span class="qq-flag-tag">${item.flagCount} flags</span>`;
  } else if (item.status === 'pending-answer') {
    footExtra = `<span>${item.pendingAnswer.role === 'verified-buyer' ? 'Verified buyer' : 'Community'} · Answer to: ${escapeHtml(item.customer)}</span>`;
  } else if (item.status === 'answered') {
    footExtra = `<span>${item.answers.length} answers</span>${item.followups && item.followups.length ? `<span>${item.followups.length} follow-up</span>` : ''}<span>${item.upvotes} upvotes</span>`;
  } else {
    footExtra = `<span>${item.upvotes} upvotes</span>`;
  }

  // Status pill — only shown on the "All" tab where statuses are mixed
  const statusPill = state.currentTab === 'all' ? renderStatusPill(item) : '';

  let displayText = item.text;
  let displayName = item.customer;
  if (item.status === 'pending-answer') {
    displayText = item.pendingAnswer.text;
    displayName = item.pendingAnswer.author;
  }

  // Apply search highlights when search is active
  const nameHtml = highlightMatch(displayName);
  const productHtml = highlightMatch(item.product);
  const textHtml = highlightMatch(displayText);

  // Make the name and product clickable to open their profiles
  const nameClickable = displayName && displayName !== 'Anonymous'
    ? `<span class="qq-clickable" data-action="open-customer" data-customer="${escapeHtml(displayName)}">${nameHtml}</span>`
    : nameHtml;
  const productClickable = `<span class="qq-clickable" data-action="open-product" data-product="${escapeHtml(item.product)}">${productHtml}</span>`;

  return `
    <div class="qq-row ${showActiveStyling ? 'active' : ''} ${isSelected ? 'selected' : ''}" data-item-id="${item.id}">
      <div class="qq-row-check ${isSelected ? 'checked' : ''}" data-action="toggle-row-select" data-item-id="${item.id}">${isSelected ? '✓' : ''}</div>
      <div class="qq-row-top">
        <span class="qq-row-name">${priDot}${nameClickable}</span>
        <span class="qq-row-time">${item.time}</span>
      </div>
      <div class="qq-row-product">${productClickable}</div>
      <div class="qq-row-q">${textHtml}</div>
      <div class="qq-row-foot">${footExtra}${statusPill}</div>
    </div>
  `;
}

function renderStatusPill(item) {
  if (item.status === 'pending') {
    return '<span class="qq-status-pill pending">Pending</span>';
  }
  if (item.status === 'pending-answer') {
    return '<span class="qq-status-pill pending">Answer pending</span>';
  }
  if (item.status === 'flagged') {
    return '<span class="qq-status-pill flagged">Flagged</span>';
  }
  if (item.status === 'answered') {
    return '<span class="qq-status-pill answered">Answered</span>';
  }
  if (item.status === 'rejected') {
    return '<span class="qq-status-pill rejected">Rejected</span>';
  }
  return '';
}

function renderBulkSummary(items) {
  const selectedItems = state.questions.filter(q => state.selectedIds.includes(q.id));
  const selectedCount = selectedItems.length;
  const productsAffected = new Set(selectedItems.map(q => q.product)).size;
  const totalUpvotes = selectedItems.reduce((s, q) => s + (q.upvotes || 0), 0);

  let actionHint = '';
  if (state.currentTab === 'pending-q') actionHint = 'Approve to publish them, or reject if they are spam or off-topic.';
  else if (state.currentTab === 'pending-a') actionHint = 'Approve to publish these community answers with their trust badges.';
  else if (state.currentTab === 'flagged') actionHint = 'Dismiss flags to restore content, or delete if the flags are valid.';
  else actionHint = 'Choose a bulk action above.';

  return `
    <div class="qq-bulk-summary">
      <div class="qq-bulk-summary-art">📦</div>
      <div class="qq-bulk-summary-num">${selectedCount}</div>
      <div class="qq-bulk-summary-label">${selectedCount === 1 ? 'item' : 'items'} selected</div>

function attachAllQAEvents() {
  // Tabs (top-level — full re-render on tab change is fine)
  document.querySelectorAll('.qq-tab').forEach(el => {
    el.addEventListener('click', () => {
      state.currentTab = el.dataset.tab;
      // Clear selection, filter, and search when switching tabs
      state.selectedIds = [];
      state.productFilter = null;
      state.filterPopoverOpen = false;
      state.searchQuery = '';
      const items = getQuestionsForTab(state.currentTab);
      if (items.length > 0) state.selectedItemId = items[0].id;
      render();
    });
  });

  // Click outside to close filter popover (still needed for body events)
  if (state.filterPopoverOpen) {
    document.addEventListener('click', closeFilterPopoverOnce, { once: true });
  }

  // ============================================================
  // SEARCH WIRING — DO NOT call render() on every keystroke,
  // because that destroys the input you're typing in. Instead,
  // we only update the body (queue + conversation) inline.
  // ============================================================
  const searchInput = document.getElementById('qq-search-input');
  const hintEl = document.getElementById('qq-search-hint');

  if (searchInput) {
    const updateHintVisibility = () => {
      if (!hintEl) return;
      const showHint = (document.activeElement === searchInput) && !searchInput.value;
      hintEl.style.display = showHint ? 'block' : 'none';
    };

    searchInput.addEventListener('focus', updateHintVisibility);
    searchInput.addEventListener('blur', () => {
      // Delay so clicks on hint chips register before hiding
      setTimeout(updateHintVisibility, 150);
    });

    // Live filter as you type — only re-render the body, not the whole page
    let searchDebounce;
    searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      // Toggle clear button visibility immediately
      const clearBtn = document.getElementById('qq-search-clear');
      if (clearBtn) clearBtn.style.display = state.searchQuery ? 'flex' : 'none';
      updateHintVisibility();
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        const items = getQuestionsForTab(state.currentTab);
        if (items.length > 0 && !items.find(q => q.id === state.selectedItemId)) {
          state.selectedItemId = items[0].id;
        }
        updateAllQABody();
      }, 120);
    });

    updateHintVisibility();
  }

  // Clear search button (X inside input)
  document.getElementById('qq-search-clear')?.addEventListener('click', () => {
    state.searchQuery = '';
    if (searchInput) {
      searchInput.value = '';
      searchInput.focus();
    }
    document.getElementById('qq-search-clear').style.display = 'none';
    if (hintEl) hintEl.style.display = 'block';
    updateAllQABody();
  });

  // Hint example chips
  document.querySelectorAll('[data-search-example]').forEach(el => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const term = el.dataset.searchExample;
      state.searchQuery = term;
      if (searchInput) {
        searchInput.value = term;
        searchInput.focus();
      }
      const clearBtn = document.getElementById('qq-search-clear');
      if (clearBtn) clearBtn.style.display = 'flex';
      if (hintEl) hintEl.style.display = 'none';
      const items = getQuestionsForTab(state.currentTab);
      if (items.length > 0 && !items.find(q => q.id === state.selectedItemId)) {
        state.selectedItemId = items[0].id;
      }
      updateAllQABody();
    });
  });

  // Body events (queue rows, conversation actions, filter, etc.)
  attachQueueAndConvEvents();
}

function closeFilterPopoverOnce() {
  if (state.filterPopoverOpen) {
    state.filterPopoverOpen = false;
    render();
  }
}

/* ---------- Bulk selection helpers ---------- */
function toggleRowSelect(itemId) {
  if (state.selectedIds.includes(itemId)) {
    state.selectedIds = state.selectedIds.filter(id => id !== itemId);
  } else {
    state.selectedIds.push(itemId);
  }
  render();
}

function toggleSelectAll() {
  const items = getQuestionsForTab(state.currentTab);
  const visibleIds = items.map(q => q.id);
  const allSelected = visibleIds.every(id => state.selectedIds.includes(id));
  if (allSelected) {
    state.selectedIds = state.selectedIds.filter(id => !visibleIds.includes(id));
  } else {
    state.selectedIds = [...new Set([...state.selectedIds, ...visibleIds])];
  }
  render();
}

function selectAllInTab() {
  const items = getQuestionsForTab(state.currentTab);
  state.selectedIds = items.map(q => q.id);
  render();
}

function clearSelection() {
  state.selectedIds = [];
  render();
}

function bulkAction(action) {
  const count = state.selectedIds.length;
  if (count === 0) return;

  if (action === 'approve') {
    // Move pending questions to "approved" state.
    // For prototype: mark as answered with a placeholder, OR keep as pending but visible.
    // Realistic interpretation: "approve" just means moderation passed; question is now publicly visible
    // but unanswered. We'll move them to a separate "approved" state on the same row.
    state.questions.forEach(q => {
      if (state.selectedIds.includes(q.id) && q.tab === 'pending-q') {
        // Mark as approved, ready for answering. They stay in pending-q but lose pending status.
        // For the prototype, we'll move them to "answered" with a stub entry to keep the demo simple.
        q.tab = 'approved-pending';
      }
    });
    // Filter out the approved ones from current view
    state.questions = state.questions.filter(q => q.tab !== 'approved-pending');
    showToast(`${count} ${count === 1 ? 'question' : 'questions'} approved · published publicly · awaiting answers`);
  } else if (action === 'approve-answer') {
    state.questions.forEach(q => {
      if (state.selectedIds.includes(q.id) && q.tab === 'pending-a' && q.pendingAnswer) {
        const pa = q.pendingAnswer;
        q.tab = 'answered';
        q.status = 'answered';
        q.followups = q.followups || [];
        q.answers = (q.answers || []).concat([{
          id: 'a-bulk-' + Date.now() + '-' + q.id,
          author: pa.author,
          avatar: pa.avatar,
          role: pa.role,
          time: 'just now',
          text: pa.text,
          helpful: 0,
          isBest: false,
        }]);
        delete q.pendingAnswer;
      }
    });
    showToast(`${count} community ${count === 1 ? 'answer' : 'answers'} approved`);
  } else if (action === 'delete') {
    state.questions = state.questions.filter(q => !state.selectedIds.includes(q.id));
    showToast(`${count} ${count === 1 ? 'item' : 'items'} deleted`);
  } else if (action === 'dismiss') {
    state.questions.forEach(q => {
      if (state.selectedIds.includes(q.id) && q.tab === 'flagged') {
        q.tab = 'pending-q';
        q.status = 'pending';
        q.flags = [];
        q.flagCount = 0;
      }
    });
    showToast(`Flags dismissed on ${count} ${count === 1 ? 'item' : 'items'}`);
  }

  state.selectedIds = [];
  // Make sure selectedItemId still resolves
  const items = getQuestionsForTab(state.currentTab);
  if (items.length > 0 && !items.find(q => q.id === state.selectedItemId)) {
    state.selectedItemId = items[0].id;
  }
  render();
}

function handleConvAction(action, target) {
  const item = state.questions.find(q => q.id === state.selectedItemId);

  switch (action) {
    case 'publish': publishAnswer(); break;
    case 'reject': openSingleRejectModal(); break;
    case 'publish-reply': publishReply(); break;
    case 'approve-answer': approvePendingAnswer(); break;
    case 'reject-answer': openSingleRejectModal('answer'); break;
    case 'edit-answer': showToast('Edit mode (not implemented in prototype)'); break;
    case 'pin-answer': pinAnswer(target.dataset.questionId, target.dataset.answerId); break;
    case 'delete-answer': deleteAnswer(target.dataset.questionId, target.dataset.answerId); break;
    case 'lock-thread': showToast('Thread locked. No new answers accepted.'); break;
    case 'delete-question': showToast('Question deleted (demo)'); break;
    case 'dismiss-flags': dismissFlags(); break;
    case 'edit-flagged': showToast('Edit mode (not implemented in prototype)'); break;
    case 'delete-flagged': deleteFlaggedItem(); break;
    case 'templates': openTemplatePicker(); break;
    case 'open-customer': navigateToCustomer(target.dataset.customer, 'all-qa'); break;
    case 'open-product': navigateToProduct(target.dataset.product, 'all-qa'); break;
  }
}

function publishAnswer() {
  const text = document.getElementById('composer-text').value.trim();
  if (!text) {
    showToast('Write an answer first');
    return;
  }
  const item = state.questions.find(q => q.id === state.selectedItemId);
  // Convert this pending question into answered
  item.tab = 'answered';
  item.status = 'answered';
  item.followups = [];
  item.answers = [{
    id: 'a-new-' + Date.now(),
    author: 'Store team',
    avatar: 'ST',
    role: 'staff',
    time: 'just now',
    text: text,
    helpful: 0,
    isBest: true,
  }];
  state.currentTab = 'answered';
  showToast('Answer published — customer notified');
  render();
}

function publishReply() {
  const text = document.getElementById('composer-text').value.trim();
  if (!text) {
    showToast('Write a reply first');
    return;
  }
  const item = state.questions.find(q => q.id === state.selectedItemId);
  item.answers.push({
    id: 'a-new-' + Date.now(),
    author: 'Store team',
    avatar: 'ST',
    role: 'staff',
    time: 'just now',
    text: text,
    helpful: 0,
    isBest: false,
  });
  showToast('Reply published');
  render();
}

function approvePendingAnswer() {
  const item = state.questions.find(q => q.id === state.selectedItemId);
  const pa = item.pendingAnswer;
  // Convert to answered
  item.tab = 'answered';
  item.status = 'answered';
  item.followups = item.followups || [];
  item.answers = [{
    id: 'a-approved-' + Date.now(),
    author: pa.author,
    avatar: pa.avatar,
    role: pa.role,
    time: 'just now',
    text: pa.text,
    helpful: 0,
    isBest: false,
  }];
  delete item.pendingAnswer;
  state.currentTab = 'answered';
  showToast(`${pa.author}'s answer published`);
  render();
}

function pinAnswer(questionId, answerId) {
  const q = state.questions.find(x => x.id === questionId);
  q.answers.forEach(a => a.isBest = false);
  const target = q.answers.find(a => a.id === answerId);
  // toggle: if already pinned (we just unset all, but we want UX of un-pin)
  target.isBest = !target.isBest;
  // Reorder so best is first
  q.answers.sort((a, b) => (b.isBest ? 1 : 0) - (a.isBest ? 1 : 0));
  showToast(target.isBest ? 'Marked as best answer' : 'Best answer cleared');
  render();
}

function deleteAnswer(questionId, answerId) {
  const q = state.questions.find(x => x.id === questionId);
  q.answers = q.answers.filter(a => a.id !== answerId);
  showToast('Answer deleted');
  render();
}

function dismissFlags() {
  const item = state.questions.find(q => q.id === state.selectedItemId);
  item.tab = 'pending-q';
  item.status = 'pending';
  item.flags = [];
  item.flagCount = 0;
  state.currentTab = 'pending-q';
  showToast('Flags dismissed — content restored');
  render();
}

function deleteFlaggedItem() {
  state.questions = state.questions.filter(q => q.id !== state.selectedItemId);
  showToast('Flagged content deleted');
  render();
}

function openSingleRejectModal(target = 'question') {
  const item = state.questions.find(q => q.id === state.selectedItemId);
  const text = target === 'answer' ? item.pendingAnswer.text : item.text;
  const author = target === 'answer' ? item.pendingAnswer.author : item.customer;
  const reasons = ['Promotional or spam', 'Off-topic / not about the product', 'Duplicate of an existing question', 'Inappropriate language', 'Other'];

  openModal(`
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">Why are you rejecting this?</div>
        <div class="modal-desc">The reason is logged for your team — it won't be shown to the customer.</div>
      </div>
      <div class="modal-body">
        <div class="modal-quote">From <b>${escapeHtml(author)}</b>: ${escapeHtml(text.slice(0, 150))}${text.length > 150 ? '...' : ''}</div>
        <div class="modal-reason-options" id="reason-options">
          ${reasons.map((r, i) => `
            <div class="modal-reason-opt ${i===1?'selected':''}" data-reason="${escapeHtml(r)}">
              <div class="modal-radio"></div>
              ${escapeHtml(r)}
            </div>
          `).join('')}
        </div>
      </div>
      <div class="modal-foot with-left">
        <div class="modal-foot-left" id="email-toggle">
          <div class="modal-checkbox" id="email-checkbox"></div>
          Email customer (off by default)
        </div>
        <div class="modal-foot-actions">
          <button class="btn btn-ghost" data-action="cancel-modal">Cancel</button>
          <button class="btn btn-primary" data-action="confirm-reject" data-target="${target}">Reject ${target}</button>
        </div>
      </div>
    </div>
  `);

  // Reason selection
  document.querySelectorAll('.modal-reason-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.modal-reason-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    });
  });
  // Email toggle
  document.getElementById('email-toggle').addEventListener('click', () => {
    document.getElementById('email-checkbox').classList.toggle('checked');
    document.getElementById('email-checkbox').textContent = document.getElementById('email-checkbox').classList.contains('checked') ? '✓' : '';
  });
  // Buttons
  document.querySelector('[data-action="cancel-modal"]').addEventListener('click', closeModal);
  document.querySelector('[data-action="confirm-reject"]').addEventListener('click', () => {
    const target = document.querySelector('[data-action="confirm-reject"]').dataset.target;
    if (target === 'answer') {
      const item = state.questions.find(q => q.id === state.selectedItemId);
      delete item.pendingAnswer;
      item.tab = 'answered'; // since the question itself remains
      item.status = 'answered';
      item.followups = item.followups || [];
      item.answers = item.answers || [];
      state.currentTab = 'pending-a';
    } else {
      state.questions = state.questions.filter(q => q.id !== state.selectedItemId);
    }
    closeModal();
    showToast(target === 'answer' ? 'Community answer rejected' : 'Question rejected');
    render();
  });
}

function attachTemplateEditorEvents() {
  document.querySelector('[data-action="back-templates"]').addEventListener('click', () => {
    state.editingTemplateId = null;
    state.unsavedTemplate = false;
    render();
  });

  // Category pills
  document.querySelectorAll('.cat-pill[data-cat]').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.cat-pill[data-cat]').forEach(p => p.classList.remove('selected'));
      el.classList.add('selected');
      markTplUnsaved();
    });
  });

  // Live preview + char count
  const contentEl = document.getElementById('tpl-content');
  const previewEl = document.getElementById('tpl-preview');
  const charCountEl = document.getElementById('tpl-charcount');
  contentEl.addEventListener('input', () => {
    previewEl.textContent = contentEl.value;
    charCountEl.textContent = contentEl.value.length + ' characters';
    markTplUnsaved();
  });
  document.getElementById('tpl-name').addEventListener('input', markTplUnsaved);

  document.querySelector('[data-action="discard-template"]').addEventListener('click', () => {
    state.editingTemplateId = null;
    state.unsavedTemplate = false;
    render();
  });

  document.querySelector('[data-action="save-template"]').addEventListener('click', () => {
    const t = state.templates.find(x => x.id === state.editingTemplateId);
    t.name = document.getElementById('tpl-name').value;
    const selectedCat = document.querySelector('.cat-pill.selected');
    if (selectedCat) t.category = selectedCat.dataset.cat;
    t.content = document.getElementById('tpl-content').value;
    t.updated = 'just now';
    state.unsavedTemplate = false;
    state.editingTemplateId = null;
    showToast('Template saved');
    render();
  });
}

function markTplUnsaved() {
  state.unsavedTemplate = true;
  const msg = document.getElementById('tpl-savebar-msg');
  if (msg) msg.innerHTML = '<b>Unsaved changes.</b> They will not apply until you save.';
}

function renderChipMultiselect(settingKey, allOptions, placeholder) {
  const selected = state.settings[settingKey] || [];
  const available = allOptions.filter(o => !selected.includes(o));
  return `
    <div class="chip-multiselect" data-multiselect="${settingKey}">
      ${selected.map(item => `
        <span class="chip">
          ${escapeHtml(item)}
          <span class="chip-x" data-remove-chip="${escapeHtml(item)}" data-multiselect-key="${settingKey}">×</span>
        </span>
      `).join('')}
      <select class="chip-input" data-add-chip="${settingKey}" style="cursor: pointer;">
        <option value="">${placeholder}</option>
        ${available.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}
      </select>
    </div>
  `;
}

// Generate a realistic JSON-LD example using the chosen schema type and a sample question from real data
function generateSampleSchema() {
  const s = state.settings;
  const sample = state.questions.find(q => q.id === 'q-sarah-camera-answered') || state.questions.find(q => q.tab === 'answered');
  if (!sample) return '{}';

  const acceptedAnswer = sample.answers && sample.answers.find(a => a.isBest) || (sample.answers && sample.answers[0]);
  const productName = sample.product;
  const productUrl = `https://acmegoods.com/${productName.toLowerCase().replace(/\s+/g, '-')}`;

  if (s.seoSchemaType === 'FAQPage') {
    const obj = {
      '@context': 'https://schema.org',
      '@type': 'FAQPage',
      mainEntity: [{
        '@type': 'Question',
        name: sample.text,
        acceptedAnswer: {
          '@type': 'Answer',
          text: acceptedAnswer ? acceptedAnswer.text : '',
        },
      }],
    };
    return JSON.stringify(obj, null, 2);
  }

  // QAPage
  const otherAnswers = (sample.answers || []).filter(a => !a.isBest).map(a => ({
    '@type': 'Answer',
    text: a.text,
    upvoteCount: a.helpful || 0,
    author: {
      '@type': 'Person',
      name: a.author,
    },
    dateCreated: '2026-04-30T14:32:00Z',
  }));

  const obj = {
    '@context': 'https://schema.org',
    '@type': 'QAPage',
    mainEntity: {
      '@type': 'Question',
      name: sample.text,
      text: sample.text,
      answerCount: (sample.answers || []).length,
      upvoteCount: sample.upvotes || 0,
      dateCreated: '2026-04-28T09:15:00Z',
      author: {
        '@type': 'Person',
        name: sample.customer,
      },
      ...(acceptedAnswer ? {
        acceptedAnswer: {
          '@type': 'Answer',
          text: acceptedAnswer.text,
          upvoteCount: acceptedAnswer.helpful || 0,
          author: {
            '@type': 'Person',
            name: acceptedAnswer.author,
          },
          dateCreated: '2026-04-29T11:42:00Z',
        },
      } : {}),
      ...(otherAnswers.length ? { suggestedAnswer: otherAnswers } : {}),
    },
    about: {
      '@type': 'Product',
      name: productName,
      url: productUrl,
    },
  };
  return JSON.stringify(obj, null, 2);
}

// Tiny syntax highlighter for JSON in the preview block
function highlightJSON(jsonStr) {
  // Escape HTML first, then add coloring spans
  const escaped = escapeHtml(jsonStr);
  return escaped
    .replace(/(&quot;)([^&]*?)(&quot;)(\s*:)/g, '<span class="schema-key">$1$2$3</span>$4')
    .replace(/:\s*(&quot;)([^&]*?)(&quot;)/g, ': <span class="schema-string">$1$2$3</span>')
    .replace(/:\s*(\d+)/g, ': <span class="schema-number">$1</span>')
    .replace(/([{}\[\],])/g, '<span class="schema-bracket">$1</span>');
}

function renderAppearancePreview() {
  const s = state.settings;
  const radiusMap = { sharp: '0px', rounded: '8px', pill: '999px' };
  const fontStack =
    s.apprFontMode === 'system' ? '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif' :
    s.apprFontMode === 'custom' ? (s.apprFontCustom || 'inherit') :
    'inherit';

  const widgetClasses = [
    'preview-widget',
    `density-${s.apprDensity}`,
    `fs-${s.apprFontSize}`,
    `card-${s.apprCardStyle}`,
  ].join(' ');

  const styleVars = `
    --pw-color: ${s.apprColor};
    --pw-radius: ${radiusMap[s.apprRadius]};
    --pw-font: ${fontStack};
  `;

  // Avatar shape — only show if global avatars toggle is on
  const showAvatars = s.apprShowAvatars;
  const avatarClass = showAvatars ? `shape-${s.apprAvatarStyle}` : 'shape-hidden';

  const roleBadge = (role, label) => s.apprShowRoleBadges
    ? `<span class="pw-role ${role}">${label}</span>`
    : '';

  // Decide the top bar — depends on whether viewing logged-in or logged-out state
  const isLoggedOut = state.apprPreviewState === 'logged-out';
  const requiresLogin = isLoggedOut && s.whoCanAsk === 'logged-in';

  const topBarHtml = requiresLogin ? `
    <div class="pw-q-bar">
      <span>3 questions</span>
      <button class="pw-ask-btn">Log in to ask</button>
    </div>
  ` : `
    <div class="pw-q-bar">
      <span>3 questions</span>
      <button class="pw-ask-btn">Ask a question</button>
    </div>
  `;

  // Login prompt card (shown only in logged-out + login-required mode)
  const loginPromptHtml = requiresLogin ? `
    <div class="pw-login-prompt">
      <div class="pw-login-mark">💬</div>
      <div class="pw-login-title">Have a question?</div>
      <div class="pw-login-text">Log in or create a free account to ask. It only takes a minute.</div>

        <button class="pw-login-btn secondary">Create account</button>
      </div>
      <div class="pw-login-note">
        Already a customer? Your purchase history makes your answers more useful to other buyers.
      </div>
    </div>
  ` : '';

  // In logged-out state, we hide upvote / helpful / flag actions since those need login.
  // But still show all existing answered Q&A — reading is always free.
  const showUpvotes = s.apprShowUpvotes && !isLoggedOut;
  const showHelpful = s.apprShowHelpful && !isLoggedOut;

  return `

function getEmailVariables(emailId) {

    { code: '{date}', desc: 'Current date' },

    { code: '{author_name}', desc: 'Who wrote the answer' },

  const map = {

      { code: '{top_question_upvotes}', desc: 'Upvotes on top question' },

function attachSettingsEvents() {
  document.querySelectorAll('.settings-tab').forEach(el => {
    el.addEventListener('click', () => {
      state.currentSettingsTab = el.dataset.tab;
      render();
    });
  });

  // Toggles
  // Settings keys that conditionally render other UI — flip these triggers re-render
  const reRenderToggles = new Set([
    'enableTrustTier',
    'pauseSubmissions',
    'profanityFilter',
    'notifyNewQuestion',
    'notifyUpvoteThreshold',
    'notifyUnansweredReminder',
    'seoEnabled',
    'seoDelegateToSEOPlugin',
    'seoEnableOG',
    // Appearance toggles need to update the live preview, so re-render
    'apprShowUpvotes',
    'apprShowHelpful',
    'apprShowRoleBadges',
    'apprShowBestHighlight',
    'apprShowAvatars',
  ]);

  // Keys that should also trigger re-render when changed via select dropdown
  const reRenderSelects = new Set([
    'apprFontMode',  // toggles the custom font stack input visibility
  ]);

  document.querySelectorAll('.toggle[data-setting]').forEach(el => {
    el.addEventListener('click', () => {
      const settingKey = el.dataset.setting;
      el.classList.toggle('on');
      state.settings[settingKey] = el.classList.contains('on');
      markSettingsUnsaved();
      if (reRenderToggles.has(settingKey)) {
        render();
      }
    });
  });

  // Radio cards (click anywhere to select)
  document.querySelectorAll('.radio-card[data-radio-setting]').forEach(el => {
    el.addEventListener('click', () => {
      const key = el.dataset.radioSetting;
      const value = el.dataset.value;
      state.settings[key] = value;
      markSettingsUnsaved();
      render();
    });
  });

  // Chip multi-select — add via dropdown
  document.querySelectorAll('[data-add-chip]').forEach(el => {
    el.addEventListener('change', (e) => {
      const key = el.dataset.addChip;
      const value = e.target.value;
      if (!value) return;
      const current = state.settings[key] || [];
      if (!current.includes(value)) {
        state.settings[key] = [...current, value];
        markSettingsUnsaved();
        render();
      }
    });
  });

  // Chip multi-select — remove
  document.querySelectorAll('[data-remove-chip]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = el.dataset.multiselectKey;
      const value = el.dataset.removeChip;
      state.settings[key] = (state.settings[key] || []).filter(x => x !== value);
      markSettingsUnsaved();
      render();
    });
  });

  // Inputs and selects (skip toggles, radio cards, chip selects, etc.)
  document.querySelectorAll('[data-setting]').forEach(el => {
    if (el.classList.contains('toggle')) return;
    if (el.dataset.addChip) return;
    el.addEventListener('change', () => {
      const key = el.dataset.setting;
      state.settings[key] = el.value;
      markSettingsUnsaved();
      if (reRenderSelects.has(key)) {
        render();
      }
    });
    el.addEventListener('input', () => {
      const key = el.dataset.setting;
      state.settings[key] = el.value;
      markSettingsUnsaved();
    });
  });

  document.querySelector('[data-action="save-settings"]')?.addEventListener('click', () => {
    state.unsavedSettings = 0;
    showToast('Settings saved');
    render();
  });

  document.querySelector('[data-action="discard-settings"]')?.addEventListener('click', () => {
    state.unsavedSettings = 0;
    state.settings = JSON.parse(JSON.stringify(initialState.settings));
    render();
  });

  // Import / Export tab actions
  document.querySelector('[data-action="generate-export"]')?.addEventListener('click', () => {
    const range = document.getElementById('export-range')?.value || 'Last 30 days';
    const status = document.getElementById('export-status')?.value || 'All statuses';
    const product = document.getElementById('export-product')?.value || 'All products';
    const format = document.getElementById('export-format')?.value || 'CSV';
    const filename = `quick-qa-export-${new Date().toISOString().slice(0, 10)}.${format.toLowerCase().includes('json') ? 'json' : 'csv'}`;
    const resultEl = document.getElementById('export-result');
    if (!resultEl) return;
    resultEl.innerHTML = `
      <div style="background: var(--cream-2); border: 0.5px solid var(--hairline); border-radius: var(--r-md); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <div style="font-size: 13px; color: var(--text); font-weight: 500;">${escapeHtml(filename)}</div>
          <div style="font-size: 12px; color: var(--text-3); margin-top: 2px;">${escapeHtml(range)} · ${escapeHtml(status)} · ${escapeHtml(product)} · 87 rows</div>
        </div>
        <a href="#" class="btn btn-primary" style="text-decoration: none;" onclick="event.preventDefault(); showToast('Download started');">Download</a>
      </div>
    `;
    showToast('Export ready');
  });

  document.querySelector('[data-action="upload-csv"]')?.addEventListener('click', () => {
    setPage('import');
  });

  // Email templates list — toggle on/off and click Edit
  document.querySelectorAll('[data-email-toggle]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.emailToggle;
      const email = state.emails.find(x => x.id === id);
      email.enabled = !email.enabled;
      showToast(email.enabled ? `${email.name} enabled` : `${email.name} disabled`);
      render();
    });
  });
  document.querySelectorAll('[data-email-edit]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      state.editingEmailId = el.dataset.emailEdit;
      render();
    });
  });
  document.querySelectorAll('[data-email-row]').forEach(el => {
    el.addEventListener('click', () => {
      state.editingEmailId = el.dataset.emailRow;
      render();
    });
  });

  // Email editor — back button, variable insertion, live preview, enable toggle
  document.querySelector('[data-action="email-back"]')?.addEventListener('click', () => {
    state.editingEmailId = null;
    state.unsavedEmail = false;
    render();
  });

  // Live preview update as user types in subject or body
  const subjectEl = document.getElementById('email-subject');
  const bodyEl = document.getElementById('email-body');
  const previewSubjectEl = document.getElementById('preview-subject');
  const previewBodyEl = document.getElementById('preview-body');
  const senderOverrideEl = document.getElementById('email-sender-override');

  if (subjectEl && bodyEl) {
    const email = state.emails.find(e => e.id === state.editingEmailId);

    const updatePreview = () => {
      if (previewSubjectEl) previewSubjectEl.textContent = renderEmailWithSampleData(subjectEl.value);
      if (previewBodyEl) previewBodyEl.textContent = renderEmailWithSampleData(bodyEl.value);
    };

    subjectEl.addEventListener('input', () => {
      email.subject = subjectEl.value;
      state.unsavedEmail = true;
      markSettingsUnsaved();
      updatePreview();
    });
    bodyEl.addEventListener('input', () => {
      email.body = bodyEl.value;
      state.unsavedEmail = true;
      markSettingsUnsaved();
      updatePreview();
    });
    if (senderOverrideEl) {
      senderOverrideEl.addEventListener('input', () => {
        email.senderOverride = senderOverrideEl.value;
        state.unsavedEmail = true;
        markSettingsUnsaved();
      });
    }
  }

  // Variable insertion — click to inject at cursor position in body
  document.querySelectorAll('[data-insert-variable]').forEach(el => {
    el.addEventListener('click', () => {
      const code = el.dataset.insertVariable;
      const target = bodyEl;
      if (!target) return;
      const start = target.selectionStart;
      const end = target.selectionEnd;
      const before = target.value.slice(0, start);
      const after = target.value.slice(end);
      target.value = before + code + after;
      // Move cursor to right after inserted variable
      target.focus();
      target.selectionStart = target.selectionEnd = start + code.length;
      // Update state and preview
      const email = state.emails.find(e => e.id === state.editingEmailId);
      email.body = target.value;
      state.unsavedEmail = true;
      markSettingsUnsaved();
      if (previewBodyEl) previewBodyEl.textContent = renderEmailWithSampleData(target.value);
    });
  });

  // Enable toggle inside the editor
  document.querySelector('[data-email-enable-toggle]')?.addEventListener('click', (e) => {
    const id = e.currentTarget.dataset.emailEnableToggle;
    const email = state.emails.find(x => x.id === id);
    email.enabled = !email.enabled;
    state.unsavedEmail = true;
    markSettingsUnsaved();
    render();
  });

  // Send test email button
  document.querySelector('[data-action="send-test-email"]')?.addEventListener('click', () => {
    showToast(`Test email sent to ${state.settings.emailSenderAddress}`);
  });

  // SEO — copy schema to clipboard
  document.querySelector('[data-action="copy-schema"]')?.addEventListener('click', () => {
    const text = generateSampleSchema();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('schema-copy-btn');
        if (btn) {
          btn.textContent = 'Copied ✓';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = 'Copy';
            btn.classList.remove('copied');
          }, 1800);
        }
        showToast('Schema copied to clipboard');
      }).catch(() => showToast('Could not copy — select and copy manually'));
    } else {
      showToast('Copy to clipboard not supported in this browser');
    }
  });

  // SEO — open Google Rich Results test link
  document.querySelector('[data-action="open-google-test"]')?.addEventListener('click', () => {
    window.open('https://search.google.com/test/rich-results', '_blank', 'noopener');
  });

  // SEO — banner shortcut to enable delegation
  document.querySelector('[data-action="enable-delegate"]')?.addEventListener('click', () => {
    state.settings.seoDelegateToSEOPlugin = true;
    markSettingsUnsaved();
    showToast('Schema delegation enabled — your SEO plugin will handle Q&A schema');
    render();
  });

  // Appearance — preset color swatch click
  document.querySelectorAll('[data-color-preset]').forEach(el => {
    el.addEventListener('click', () => {
      state.settings.apprColor = el.dataset.colorPreset;
      markSettingsUnsaved();
      render();
    });
  });

  // Appearance — custom hex input
  const hexInput = document.getElementById('appr-hex');
  if (hexInput) {
    let hexDebounce;
    hexInput.addEventListener('input', (e) => {
      let val = e.target.value.trim();
      if (val && !val.startsWith('#')) val = '#' + val;
      // Validate: must be #RGB or #RRGGBB
      if (/^#[0-9A-Fa-f]{3}$|^#[0-9A-Fa-f]{6}$/.test(val)) {
        state.settings.apprColor = val.toUpperCase();
        markSettingsUnsaved();
        clearTimeout(hexDebounce);
        hexDebounce = setTimeout(() => render(), 200);
      }
    });
  }

  // Appearance — custom CSS textarea
  const cssArea = document.getElementById('appr-custom-css');
  if (cssArea) {
    cssArea.addEventListener('input', (e) => {
      state.settings.apprCustomCSS = e.target.value;
      markSettingsUnsaved();
    });
  }

  // Appearance — Custom CSS collapsible toggle
  document.querySelector('[data-action="toggle-css-collapsible"]')?.addEventListener('click', () => {
    state.cssCollapsibleOpen = !state.cssCollapsibleOpen;
    document.getElementById('css-collapsible')?.classList.toggle('open');
  });

  // Appearance — preview state switcher (logged-in vs logged-out)
  document.querySelectorAll('[data-preview-state]').forEach(el => {
    el.addEventListener('click', () => {
      state.apprPreviewState = el.dataset.previewState;
      render();
    });
  });
}

function markSettingsUnsaved() {
  state.unsavedSettings = (state.unsavedSettings || 0) + 1;
  const msg = document.getElementById('settings-savebar-msg');
  if (msg) msg.innerHTML = `<b>${state.unsavedSettings} unsaved change${state.unsavedSettings>1?'s':''}.</b> They will not apply until you save.`;
}

/* ===========================================================================

=========================================================================== */
function renderCustomersDirectory() {
  const customers = getAllCustomersForDirectory();
  const sort = state.customersDirectorySort;
  customers.sort((a, b) => {
    switch (sort) {
      case 'name-asc': return a.name.localeCompare(b.name);
      case 'name-desc': return b.name.localeCompare(a.name);
      case 'questions-desc': return (b.computedAsked||0) - (a.computedAsked||0);
      case 'answers-desc': return (b.computedAnswered||0) - (a.computedAnswered||0);
      case 'value-desc': {
        const av = a.orders ? parseFloat((a.orders.lifetimeValue||'$0').replace(/[$,]/g, '')) : 0;
        const bv = b.orders ? parseFloat((b.orders.lifetimeValue||'$0').replace(/[$,]/g, '')) : 0;
        return bv - av;
      }
      default: return 0;
    }
  });

  const sortedClass = (key) => sort === key ? 'sorted' : '';

  return `
    <div class="qq-top">
      <div class="qq-top-left">
        <span class="qq-page-label">Analytics · All customers</span>
      </div>
    </div>

    <div class="directory-content">
      <button class="back-nav" data-action="back-to-analytics">← Back to Analytics</button>
      <h1 class="page-title">All customers</h1>
      <p class="page-sub">Everyone who has asked or answered a question. <b>${customers.length} total</b>.</p>

      <div class="directory-toolbar">
        <div class="directory-toolbar-left">${customers.length} customers</div>
      </div>

      <div class="directory-table">
        <div class="directory-row directory-customers-grid head">
          <div></div>
          <span class="${sortedClass('name-asc')}" data-sort="name-asc">Customer</span>
          <span class="${sortedClass('questions-desc')}" data-sort="questions-desc">Questions ▾</span>
          <span class="${sortedClass('answers-desc')}" data-sort="answers-desc">Answers</span>
          <span>Helpful</span>
          <span>Recent products</span>
          <span class="${sortedClass('value-desc')}" data-sort="value-desc">Lifetime value</span>
        </div>
        ${customers.map(c => {
          const guestClass = c.isGuest ? 'guest' : '';
          const helpfulVotes = c.stats ? c.stats.helpfulVotes : 0;
          const ltv = c.orders ? c.orders.lifetimeValue : '—';
          const recent = (c.recentProducts && c.recentProducts.length)
            ? c.recentProducts.slice(0, 2).join(', ') + (c.recentProducts.length > 2 ? ` +${c.recentProducts.length-2}` : '')
            : '<span class="directory-faded">—</span>';
          return `
            <div class="directory-row directory-customers-grid" data-customer="${escapeHtml(c.name)}">
              <div class="directory-av ${guestClass}">${c.avatar || '?'}</div>
              <div>
                <div class="directory-name">${escapeHtml(c.name)}</div>
                <div class="directory-name-sub">${c.isGuest ? 'Guest customer' : (c.type === 'verified-buyer' ? 'Verified buyer' : 'Customer')}</div>
              </div>
              <div class="directory-num">${c.computedAsked || 0}</div>
              <div class="directory-num">${c.computedAnswered || 0}</div>
              <div class="directory-num">${helpfulVotes}</div>
              <div class="directory-faded">${recent}</div>
              <div class="directory-num">${ltv}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

            <div class="profile-stat-label">Lifetime value</div>
            <div class="profile-stat-num">${profile.orders.lifetimeValue}</div>
            <div class="profile-stat-sub">${profile.orders.count} ${profile.orders.count === 1 ? 'order' : 'orders'}</div>
          </div>
          <div class="profile-stat">
            <div class="profile-stat-label">Risk signals</div>
            <div class="profile-stat-num ${profile.flags.received > 0 ? 'warm' : ''}">${profile.flags.received}</div>
            <div class="profile-stat-sub">${profile.flags.rejected} ${profile.flags.rejected === 1 ? 'rejection' : 'rejections'}</div>
          </div>
        </div>
      ` : ''}

      <div class="profile-section">
        <div class="profile-section-head">
          <h2 class="profile-section-title">Questions asked</h2>
          <div class="profile-section-sub">${history.asked.length} total</div>
        </div>
        ${history.asked.length === 0 ? `
          <div class="profile-blank">
            <div class="profile-blank-mark">💬</div>
            ${isGuest ? "This guest hasn't asked any questions yet visible in the system." : 'No questions yet.'}
          </div>
        ` : history.asked.map(q => `
          <div class="profile-activity-item qq-clickable" data-action="open-product" data-product="${escapeHtml(q.product)}">
            <div class="profile-activity-body">
              <div class="profile-activity-product">${escapeHtml(q.product)}</div>
              <div class="profile-activity-text">${escapeHtml(q.text)}</div>
            </div>
            <div class="profile-activity-meta">
              ${renderStatusPill(q)}
              <span style="display: block; margin-top: 6px;">${q.time}</span>
            </div>
          </div>
        `).join('')}
      </div>

      ${!isGuest ? `
        <div class="profile-section">
          <div class="profile-section-head">
            <h2 class="profile-section-title">Answers contributed</h2>
            <div class="profile-section-sub">${history.answered.length} total</div>
          </div>
          ${history.answered.length === 0 ? `
            <div class="profile-blank">
              <div class="profile-blank-mark">✏️</div>
              No community answers contributed yet.
            </div>
          ` : history.answered.map(({question, answer, status}) => `

                <div class="profile-activity-text">${escapeHtml(answer.text)}</div>
              </div>
              <div class="profile-activity-meta">

                  ? '<span class="qq-status-pill pending">Pending</span>'
                  : `<span class="profile-activity-meta-strong">${answer.helpful || 0} helpful</span>`}
                <span>${answer.time}</span>
              </div>
            </div>
          `).join('')}
        </div>

          <div class="profile-section-head">
            <h2 class="profile-section-title">Recent purchases</h2>
            <div class="profile-section-sub">${profile.orders.count} ${profile.orders.count === 1 ? 'order' : 'orders'} · ${profile.orders.lifetimeValue} lifetime</div>
          </div>
          ${profile.recentProducts.length === 0 ? `
            <div class="profile-blank">No purchase history available.</div>
          ` : `
            <div class="themes-chips">
              ${profile.recentProducts.map(p => `
                <span class="theme-chip qq-clickable" data-action="open-product" data-product="${escapeHtml(p)}">${escapeHtml(p)}</span>
              `).join('')}
            </div>
          `}
        </div>
      ` : `
        <div class="profile-section">
          <div class="profile-blank" style="padding: 40px 16px;">
            <div class="profile-blank-mark">👤</div>
            <div style="margin-bottom: 6px; color: var(--text-2); font-weight: 500;">No account, no purchase history</div>
            <div>Guest customers don't have an account, so we can't show purchase data, lifetime value, or trust signals beyond their questions above.</div>
          </div>
        </div>
      `}
    </div>
  `;
}

function renderProductProfile() {
  const product = state.productProfiles[state.viewingProduct];
  if (!product) {
    return `
      <div class="qq-top"><div class="qq-top-left"><span class="qq-page-label">Product</span></div></div>
      <div class="profile-content">
        <button class="back-nav" data-action="profile-back">← Back</button>
        <div class="profile-blank">No product data available.</div>
      </div>
    `;
  }

  const history = getProductQAHistory(product.name);
  const stats = product.stats;
  const answerRate = stats.totalQuestions > 0 ? Math.round((stats.answered / stats.totalQuestions) * 100) : 0;

  // Top recent questions on this product
  const recent = history.all.slice(0, 6);

  return `
    <div class="qq-top">
      <div class="qq-top-left">
        <span class="qq-page-label">Product · ${escapeHtml(product.name)}</span>

            <b>${stats.totalUpvotes}</b> upvotes ·
            <b>${stats.communityAnswers}</b> community answers

        </div>
      </div>

      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-label">Total questions</div>
          <div class="profile-stat-num">${stats.totalQuestions}</div>

        <div class="profile-stat">

        <div class="profile-stat">

}

function attachProfileEvents() {
  document.querySelector('[data-action="profile-back"]')?.addEventListener('click', navigateBack);
  document.querySelectorAll('[data-action="open-customer"]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      navigateToCustomer(el.dataset.customer, state.navigationOrigin);
    });
  });
  document.querySelectorAll('[data-action="open-product"]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      navigateToProduct(el.dataset.product, state.navigationOrigin);
    });
  });
}

// Reset all setting tweaks before applying a new scenario
function fpResetSettings() {
  // Reset to widely-applicable defaults; only the keys touched by scenarios
  Object.assign(state.settings, {
    pauseSubmissions: false,
    whoCanAsk: 'both',
    requireEmailForGuests: true,
    enableRecaptcha: false,
    submissionRateLimit: 3,
    questionApprovalMode: 'manual',
    profanityFilter: true,
    allowCommunity: true,
    allowVerifiedBuyers: true,
    allowLoggedInCustomers: true,
    apprColor: '#FF6B4A',
    apprRadius: 'rounded',
    apprCardStyle: 'bordered',
    apprShowUpvotes: true,
    apprShowHelpful: true,
    apprShowRoleBadges: true,
    apprShowBestHighlight: true,
    apprShowAvatars: true,
  });
  state.fpAskFormOpen = false;
  state.fpExpandedThreadId = null;
  state.fpSubmissionState = null;
  state.fpUserState = 'logged-in';
  state.fpSearch = '';
  state.fpFlagModal = null;
}

function fpApplyScenario(id) {
  const sc = FRONTEND_SCENARIOS.find(s => s.id === id);
  if (!sc) return;
  fpResetSettings();
  state.fpScenario = id;
  sc.apply();
  render();
}

function renderFrontendPreview() {
  return `
    <div class="fp-layout">
      <div class="fp-mockup-area">
        ${renderProductPageMockup()}
        ${renderScenarioCallout()}
      </div>
      ${renderScenarioInspector()}
    </div>
  `;
}

function renderScenarioCallout() {
  const sc = FRONTEND_SCENARIOS.find(s => s.id === state.fpScenario);
  if (!sc || !sc.callout) return '';
  return `
    <div class="fp-callout">
      <b>What's happening:</b> ${sc.callout}
    </div>
  `;
}

function renderScenarioInspector() {
  // Group scenarios by their group label
  const groups = {};
  FRONTEND_SCENARIOS.forEach(sc => {
    if (!groups[sc.group]) groups[sc.group] = [];
    groups[sc.group].push(sc);
  });

  let html = '';
  Object.entries(groups).forEach(([group, scenarios]) => {
    html += `<div class="fp-scenario-group-label">${escapeHtml(group)}</div>`;
    scenarios.forEach(sc => {
      html += `
        <div class="fp-scenario ${state.fpScenario === sc.id ? 'active' : ''}" data-scenario="${sc.id}">
          <div class="fp-scenario-title">${escapeHtml(sc.title)}</div>
          <div class="fp-scenario-desc">${escapeHtml(sc.desc)}</div>
        </div>
      `;
    });
  });

  return `

      <div class="fp-inspector-head">

/* Map the "Simulate user as" tab to an actual person.
 * This is what teaches developers: different real users see different UI.
 *  - 'logged-in'      → Sarah K. (asker of thread-1, lets us show follow-up)
 *  - 'verified-buyer' → Sandra M. (a buyer but NOT an asker)
 *  - 'logged-out'     → anonymous
 */
function getFPSimulatedUser() {
  if (state.fpUserState === 'logged-in') return { name: 'Sarah K.', isLoggedIn: true };
  if (state.fpUserState === 'verified-buyer') return { name: 'Sandra M.', isLoggedIn: true, isVerifiedBuyer: true };
  return { name: null, isLoggedIn: false };
}

function getFPVisibleQuestions() {
  let qs = getFPSampleQuestions();
  // Filter by search
  if (state.fpSearch) {
    const q = state.fpSearch.toLowerCase();
    qs = qs.filter(t => t.text.toLowerCase().includes(q) || (t.answers || []).some(a => a.text.toLowerCase().includes(q)));
  }
  // Filter by tab (answered/unanswered)
  if (state.fpFilter === 'answered') qs = qs.filter(t => t.answered);
  else if (state.fpFilter === 'unanswered') qs = qs.filter(t => !t.answered);
  return qs;
}

function renderFPQAWidget() {
  const s = state.settings;
  const radiusMap = { sharp: '0px', rounded: '8px', pill: '999px' };
  const fontStack =
    s.apprFontMode === 'system' ? '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif' :
    s.apprFontMode === 'custom' ? (s.apprFontCustom || 'inherit') :
    'inherit';

  const widgetStyle = `
    --fp-color: ${s.apprColor};
    --fp-radius: ${radiusMap[s.apprRadius]};
    --fp-fs-base: ${ {small: '13px', medium: '14px', large: '15px'}[s.apprFontSize] || '14px' };
    --fp-pad: ${ {compact: '12px', comfortable: '16px', spacious: '22px'}[s.apprDensity] || '16px' };
    --fp-gap: ${ {compact: '10px', comfortable: '14px', spacious: '18px'}[s.apprDensity] || '14px' };
    --fp-card-bg: ${ s.apprCardStyle === 'filled' ? '#FAFAF8' : (s.apprCardStyle === 'minimal' ? 'transparent' : 'white') };
    --fp-card-border: ${ s.apprCardStyle === 'minimal' || s.apprCardStyle === 'filled' ? '0' : '1px solid #ebebeb' };
    --fp-font: ${fontStack};
  `;

  return `
    <div class="qa-widget" style="${widgetStyle}">
      ${renderFPHeader()}
      ${renderFPBanners()}
      ${renderFPConfirmation()}
      ${renderFPAskForm()}
      ${renderFPLoginPrompt()}
      ${renderFPControls()}
      ${renderFPQuestionList()}
    </div>
  `;
}

function renderFPHeader() {
  const s = state.settings;
  const questions = getFPVisibleQuestions();
  const isLoggedOut = state.fpUserState === 'logged-out';
  const requiresLogin = s.whoCanAsk === 'logged-in' && isLoggedOut;
  const paused = s.pauseSubmissions;

  // Decide the right CTA
  let ctaHtml = '';
  if (paused) {
    ctaHtml = ''; // No button when paused
  } else if (requiresLogin) {
    ctaHtml = '<button class="qa-ask-btn" data-action="fp-open-login">Log in to ask</button>';
  } else if (!state.fpAskFormOpen) {
    ctaHtml = '<button class="qa-ask-btn" data-action="fp-toggle-ask">Ask a question</button>';
  }

  return `
    <div class="qa-head">
      <div class="qa-head-info">
        <h3 class="qa-head-title">Questions & answers</h3>
        <div class="qa-head-sub">${questions.length} ${questions.length === 1 ? 'question' : 'questions'} about this product</div>
      </div>
      ${ctaHtml}
    </div>
  `;
}

function renderFPBanners() {
  const s = state.settings;
  if (s.pauseSubmissions) {
    return `
      <div class="qa-banner">
        <span>ℹ</span>
        <div><b>We're not accepting new questions right now.</b> Please check back later. You can still browse existing Q&A below.</div>
      </div>
    `;
  }
  return '';
}

function renderFPConfirmation() {
  const sub = state.fpSubmissionState;
  if (!sub || sub === 'profanity-blocked' || sub === 'rate-limited') return '';

  if (sub === 'submitted-pending') {
    return `
      <div class="qa-confirm pending">
        <div class="qa-confirm-mark">⌛</div>
        <div class="qa-confirm-body">
          <div class="qa-confirm-title">Your question is being reviewed</div>
          <div class="qa-confirm-text">It will appear here once approved. We'll email you when it's answered.</div>
        </div>
      </div>
    `;
  }

  if (sub === 'submitted-published') {
    return `
      <div class="qa-confirm">
        <div class="qa-confirm-mark">✓</div>
        <div class="qa-confirm-body">
          <div class="qa-confirm-title">Your question is now visible</div>
          <div class="qa-confirm-text">Customers and our team can see it below. We'll email you when it's answered.</div>
        </div>
      </div>

  }

  return '';
}

  // Hide controls when no questions, or when login prompt is shown, or when ask form is open as primary view

          <div class="qa-filter-pills">
            <button class="qa-filter-pill ${state.fpFilter==='all'?'active':''}" data-fp-filter="all">All</button>
            <button class="qa-filter-pill ${state.fpFilter==='answered'?'active':''}" data-fp-filter="answered">Answered</button>
            <button class="qa-filter-pill ${state.fpFilter==='unanswered'?'active':''}" data-fp-filter="unanswered">Unanswered</button>

function renderFPQuestionList() {
  if (state.fpScenario === 'no-questions') {
    return `
      <div class="qa-empty">
        <div class="qa-empty-mark">💬</div>
        <div class="qa-empty-title">No questions yet</div>
        <div>Be the first to ask about this product. Our team typically responds within 24 hours.</div>
      </div>
    `;
  }

  const questions = getFPVisibleQuestions();
  if (questions.length === 0 && state.fpSearch) {
    return `
      <div class="qa-empty">
        <div class="qa-empty-mark">⌕</div>
        <div class="qa-empty-title">No questions match "${escapeHtml(state.fpSearch)}"</div>
        <div>Try a different keyword, or <span data-action="fp-clear-search" style="color: var(--fp-color); cursor: pointer; font-weight: 500;">clear the search</span> to see all.</div>
      </div>
    `;
  }

  let html = questions.map(t => renderFPThread(t)).join('');
  if (questions.length >= 3) {
    html += `<div class="qa-load-more"><button class="qa-load-more-btn">Show more questions</button></div>`;
  }
  return html;
}

function renderFPThread(thread) {
  const s = state.settings;
  const isExpanded = state.fpExpandedThreadId === thread.id;
  const showAvatars = s.apprShowAvatars;
  const avatarClass = showAvatars ? `shape-${s.apprAvatarStyle || 'circle'}` : 'shape-hidden';
  const userVoted = state.fpUpvoted.includes(thread.id);
  const isLoggedOut = state.fpUserState === 'logged-out';

  const upvoteBtn = s.apprShowUpvotes && !isLoggedOut
    ? `<button class="qa-vote-btn ${userVoted ? 'voted' : ''}" data-action="fp-upvote" data-thread-id="${thread.id}">▲ ${thread.upvotes + (userVoted ? 1 : 0)}</button>`
    : '';

  const statusText = thread.answered ? '' : '<span style="color: #C66; font-size: 11px;">· Awaiting answer</span>';

  return `
    <div class="qa-thread ${isExpanded ? 'expanded' : ''}">
      <div class="qa-q-row" data-action="fp-toggle-thread" data-thread-id="${thread.id}">
        <div class="qa-av ${avatarClass}">${thread.askerInitials}</div>
        <div class="qa-q-body">
          <div class="qa-q-meta">
            <b>${escapeHtml(thread.asker)}</b>
            ${s.apprShowRoleBadges ? '<span class="qa-role">Customer</span>' : ''}
            <span>· ${thread.time}</span>
            ${statusText}
          </div>
          <div class="qa-q-text">${escapeHtml(thread.text)}</div>
          <div class="qa-q-foot">
            ${upvoteBtn}
            <span class="qa-foot-link" data-action="fp-toggle-thread" data-thread-id="${thread.id}">${isExpanded ? 'Collapse' : `${thread.answers.length} ${thread.answers.length === 1 ? 'answer' : 'answers'}`}</span>
            ${!isLoggedOut ? `<span class="qa-foot-link" data-action="fp-open-flag" data-flag-type="question" data-flag-id="${thread.id}">⚐ Flag</span>` : ''}
          </div>
        </div>
      </div>
      ${isExpanded ? renderFPAnswers(thread) : ''}
    </div>
  `;
}

function renderFPAnswers(thread) {
  const s = state.settings;
  const showAvatars = s.apprShowAvatars;
  const avatarClass = showAvatars ? `shape-${s.apprAvatarStyle || 'circle'}` : 'shape-hidden';
  const isLoggedOut = state.fpUserState === 'logged-out';
  const user = getFPSimulatedUser();

  const canAnswer = !isLoggedOut && (
    (state.fpUserState === 'verified-buyer' && s.allowVerifiedBuyers) ||
    (state.fpUserState === 'logged-in' && s.allowLoggedInCustomers)
  ) && s.allowCommunity;

  // Follow-up: ONLY the original asker sees this link, and only after the thread is answered.
  // Locked threads and threads where they've already used their one follow-up don't show it.
  const isAsker = user.isLoggedIn && user.name === thread.asker;
  const threadLocked = !s.allowCommunity;
  const showFollowup = isAsker && thread.answered && !threadLocked;

  const followupLink = showFollowup
    ? `<div class="qa-followup">
         <div style="font-size: 11px; color: #888; margin-bottom: 4px; font-style: italic;">Only visible to you, the original asker.</div>
         <span class="qa-followup-link" data-action="fp-toast-followup">+ Ask a follow-up</span>
       </div>`
    : '';

  const addAnswerCta = canAnswer
    ? `<div style="margin-top: 12px;"><button class="qa-ask-btn secondary" data-action="fp-toast-answer">Add your answer</button></div>`
    : !s.allowCommunity
      ? `<div style="margin-top: 12px; font-size: 12px; color: #888; font-style: italic;">This thread is closed for new answers.</div>`
      : '';

  return `
    <div class="qa-answers">
      <div class="qa-answer-label">${thread.answers.length} ${thread.answers.length === 1 ? 'answer' : 'answers'}</div>
      ${thread.answers.map(a => renderFPAnswer(a, avatarClass)).join('')}
      ${followupLink}
      ${addAnswerCta}
    </div>
  `;
}

function renderFPAnswer(answer, avatarClass) {
  const s = state.settings;
  const userVoted = state.fpHelpfulVoted.includes(answer.id);
  const isLoggedOut = state.fpUserState === 'logged-out';
  const showBest = s.apprShowBestHighlight && answer.isBest;
  const avClass = answer.role === 'staff' ? 'staff' : (answer.role === 'verified' ? 'verified' : '');

  const helpfulBtn = s.apprShowHelpful && !isLoggedOut
    ? `<span class="qa-helpful ${userVoted ? 'voted' : ''}" data-action="fp-helpful" data-answer-id="${answer.id}">${userVoted ? 'Helpful' : '↑ Helpful'} <span class="qa-helpful-count">(${answer.helpful + (userVoted ? 1 : 0)})</span></span>`
    : s.apprShowHelpful ? `<span style="font-size: 12px; color: #888;">${answer.helpful} found this helpful</span>` : '';

  let roleBadge = '';
  if (s.apprShowRoleBadges) {
    if (answer.role === 'staff') roleBadge = '<span class="qa-role staff">Store staff</span>';
    else if (answer.role === 'verified') roleBadge = '<span class="qa-role verified">Verified buyer</span>';
    else roleBadge = '<span class="qa-role">Customer</span>';
  }

  return `
    <div class="qa-answer ${showBest ? 'best' : ''}">
      <div class="qa-av ${avatarClass} ${avClass}">${answer.authorInitials}</div>
      <div class="qa-answer-body">
        <div class="qa-q-meta">
          <b>${escapeHtml(answer.author)}</b>
          ${roleBadge}
          ${showBest ? '<span class="qa-best-tag">★ BEST ANSWER</span>' : ''}
          <span>· ${answer.time}</span>
        </div>
        <div class="qa-q-text">${escapeHtml(answer.text)}</div>
        <div class="qa-q-foot">
          ${helpfulBtn}
          ${!isLoggedOut ? `<span class="qa-foot-link" data-action="fp-open-flag" data-flag-type="answer" data-flag-id="${answer.id}">⚐ Flag</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderFPFlagModal() {
  const reasons = ['Spam or promotional', 'Incorrect information', 'Offensive language', 'Duplicate question', 'Other'];
  return `
    <div class="qa-flag-modal-backdrop" data-action="fp-close-flag">
      <div class="qa-flag-modal" onclick="event.stopPropagation()">
        <div class="qa-flag-modal-title">Report this content</div>
        <div class="qa-flag-modal-sub">Help us keep Q&A useful. Reports are reviewed by our team.</div>
        <div class="qa-flag-reasons">
          ${reasons.map(r => `<div class="qa-flag-reason" data-action="fp-submit-flag" data-reason="${escapeHtml(r)}">${r}</div>`).join('')}
        </div>
        <div class="qa-flag-actions">
          <button class="qa-form-cancel" data-action="fp-close-flag">Cancel</button>
        </div>
      </div>
    </div>
  `;
}

function attachFrontendPreviewEvents() {
  // Scenario inspector clicks
  document.querySelectorAll('[data-scenario]').forEach(el => {
    el.addEventListener('click', () => fpApplyScenario(el.dataset.scenario));
  });

  // User state switcher
  document.querySelectorAll('[data-user-state]').forEach(el => {
    el.addEventListener('click', () => {
      state.fpUserState = el.dataset.userState;
      render();
    });
  });

  // Ask button
  document.querySelector('[data-action="fp-toggle-ask"]')?.addEventListener('click', () => {
    state.fpAskFormOpen = !state.fpAskFormOpen;
    state.fpSubmissionState = null;
    render();
  });

  document.querySelector('[data-action="fp-cancel-ask"]')?.addEventListener('click', () => {
    state.fpAskFormOpen = false;
    state.fpSubmissionState = null;
    render();
  });

  document.querySelector('[data-action="fp-submit-ask"]')?.addEventListener('click', () => {
    if (state.fpSubmissionState === 'profanity-blocked' || state.fpSubmissionState === 'rate-limited') return;
    // Decide outcome based on moderation mode
    state.fpAskFormOpen = false;
    if (state.settings.questionApprovalMode === 'auto') {
      state.fpSubmissionState = 'submitted-published';
    } else {
      state.fpSubmissionState = 'submitted-pending';
    }
    render();
  });

  // Login prompt (fake)
  document.querySelectorAll('[data-action="fp-fake-login"]').forEach(el => {
    el.addEventListener('click', () => {
      el.disabled = true;
      el.textContent = 'Logging in…';
      setTimeout(() => {
        state.fpUserState = 'logged-in';
        state.fpAskFormOpen = true;
        showToast('Logged in — you can now ask your question');
        render();
      }, 800);
    });
  });

  document.querySelector('[data-action="fp-open-login"]')?.addEventListener('click', () => {
    // Simulate clicking "Log in to ask" — in production redirects to wp-login.php
    showToast('In production: redirects to /wp-login.php?redirect_to=' + encodeURIComponent('/products/leather-backpack-pro#quick-qa'));
  });

  // Thread expand/collapse
  document.querySelectorAll('[data-action="fp-toggle-thread"]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.threadId;
      state.fpExpandedThreadId = state.fpExpandedThreadId === id ? null : id;
      render();
    });
  });

  // Upvote
  document.querySelectorAll('[data-action="fp-upvote"]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = el.dataset.threadId;
      if (state.fpUpvoted.includes(id)) {
        state.fpUpvoted = state.fpUpvoted.filter(x => x !== id);
      } else {
        state.fpUpvoted.push(id);
      }
      render();
    });
  });

  // Helpful
  document.querySelectorAll('[data-action="fp-helpful"]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.answerId;
      if (state.fpHelpfulVoted.includes(id)) {
        state.fpHelpfulVoted = state.fpHelpfulVoted.filter(x => x !== id);
      } else {
        state.fpHelpfulVoted.push(id);
      }
      render();
    });
  });

  // Flag modal
  document.querySelectorAll('[data-action="fp-open-flag"]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      state.fpFlagModal = { type: el.dataset.flagType, id: el.dataset.flagId };
      render();
    });
  });
  document.querySelectorAll('[data-action="fp-close-flag"]').forEach(el => {
    el.addEventListener('click', () => {
      state.fpFlagModal = null;
      render();
    });
  });
  document.querySelectorAll('[data-action="fp-submit-flag"]').forEach(el => {
    el.addEventListener('click', () => {
      state.fpFlagModal = null;
      showToast('Thanks for letting us know');
      render();
    });
  });

  // Follow-up + add-answer toasts (simple toast feedback)
  document.querySelectorAll('[data-action="fp-toast-followup"]').forEach(el => {
    el.addEventListener('click', () => showToast('Follow-up form would open inline here'));
  });
  document.querySelectorAll('[data-action="fp-toast-answer"]').forEach(el => {
    el.addEventListener('click', () => showToast('Add-answer form would open inline here'));
  });

  // Search input
  const searchEl = document.getElementById('fp-search');
  if (searchEl) {
    let dt;
    searchEl.addEventListener('input', (e) => {
      state.fpSearch = e.target.value;
      clearTimeout(dt);
      dt = setTimeout(() => render(), 150);
    });
  }
  document.querySelector('[data-action="fp-clear-search"]')?.addEventListener('click', () => {
    state.fpSearch = '';
    render();
  });

  // Sort + filter
  document.getElementById('fp-sort')?.addEventListener('change', (e) => {
    state.fpSortBy = e.target.value;
    render();
  });
  document.querySelectorAll('[data-fp-filter]').forEach(el => {
    el.addEventListener('click', () => {
      state.fpFilter = el.dataset.fpFilter;
      render();
    });
  });
}
