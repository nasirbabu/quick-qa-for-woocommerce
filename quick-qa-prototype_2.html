<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quick QA — Functional Prototype</title>
<style>
:root {
  --coral: #FF6B4A;
  --coral-hover: #FF5436;
  --coral-soft: #FFF5F0;
  --coral-soft-2: #FFE4D8;
  --coral-text: #993C1D;
  --cream: #FDFCFA;
  --cream-2: #FAF6F0;
  --cream-3: #F5F1EB;
  --hairline: #EFE9E2;
  --text: #2A2825;
  --text-2: #6A655F;
  --text-3: #8A8580;
  --text-4: #B8B3AC;
  --gold: #E8C56C;
  --gold-soft: #FAEEDA;
  --gold-text: #8B6914;
  --green: #6A8E3F;
  --green-soft: #E5F2DC;
  --red: #C44A3A;
  --red-soft: #FCEBEB;
  --red-soft-2: #FCF4F2;
  --shadow-sm: 0 1px 0 rgba(255, 107, 74, 0.3);
  --shadow-card: 0 2px 8px rgba(0,0,0,0.03);
  --shadow-modal: 0 20px 50px rgba(0,0,0,0.15);
  --shadow-savebar: 0 -2px 8px rgba(0,0,0,0.04);
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--cream);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }
a { color: var(--coral); text-decoration: none; }

/* ============================================
   APP SHELL
============================================ */
.app {
  display: grid;
  grid-template-columns: 56px 1fr;
  min-height: 100vh;
}

/* WP-style icon sidebar (auto-collapsed for Quick QA) */
.wp-sidebar {
  background: #1d2327;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0;
}
.wp-icon {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #c3c4c7;
  margin-bottom: 4px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 16px;
}
.wp-icon:hover { background: #2c3338; color: white; }
.wp-icon.active { background: var(--coral); color: white; }

.main { display: flex; flex-direction: column; min-width: 0; }

/* Plugin sub-nav (subtle, inside Quick QA) */
.plugin-nav {
  background: white;
  border-bottom: 0.5px solid var(--hairline);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 0;
  height: 48px;
  flex-shrink: 0;
}
.plugin-nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 500;
  margin-right: 32px;
}
.plugin-nav-mark {
  width: 22px;
  height: 22px;
  border-radius: var(--r-md);
  background: var(--coral);
  color: white;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 500;
}
.plugin-nav-item {
  padding: 14px 16px;
  font-size: 13px;
  color: var(--text-3);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
}
.plugin-nav-item:hover:not(.active) { color: var(--text); }
.plugin-nav-item.active {
  color: var(--text);
  border-bottom-color: var(--coral);
  font-weight: 500;
}
.plugin-nav-spacer { flex: 1; }
.plugin-nav-pro {
  background: linear-gradient(135deg, var(--coral) 0%, #FF8B6F 100%);
  color: white;
  padding: 5px 12px;
  border-radius: var(--r-md);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}

/* Content area (varies per page) */
.content {
  flex: 1;
  overflow-y: auto;
  position: relative;
}

/* ============================================
   ALL Q&A PAGE — TOP BAR
============================================ */
.qq-top {
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: white;
  border-bottom: 0.5px solid var(--hairline);
}
.qq-top-left { display: flex; align-items: center; gap: 16px; }
.qq-page-label {
  color: var(--text-3);
  font-size: 13px;
}
.qq-search {
  flex: 1;
  max-width: 320px;
  padding: 7px 12px;
  font-size: 13px;
  border-radius: var(--r-md);
  border: 0.5px solid var(--hairline);
  background: var(--cream);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}
.qq-search::placeholder { color: var(--text-4); }
.qq-search:focus { border-color: var(--coral); }
.qq-actions { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--text-3); }
.qq-actions span { cursor: pointer; }
.qq-actions span:hover { color: var(--text); }
.qq-bulk-dropdown { position: relative; }

/* Filter tabs */
.qq-tabs {
  background: white;
  padding: 0 24px;
  display: flex;
  gap: 22px;
  border-bottom: 0.5px solid var(--hairline);
}
.qq-tab {
  padding: 12px 0;
  font-size: 13px;
  color: var(--text-3);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: -1px;
  transition: color 0.1s;
}
.qq-tab:hover:not(.active) { color: var(--text); }
.qq-tab.active {
  color: var(--text);
  border-bottom-color: var(--coral);
  font-weight: 500;
}
.qq-tab-num {
  color: var(--text-4);
  font-size: 12px;
}
.qq-tab.active .qq-tab-num { color: var(--coral); }
.qq-tab-warn .qq-tab-num { color: var(--red); font-weight: 500; }

/* Two-pane body */
.qq-body {
  display: grid;
  grid-template-columns: 38% 62%;
  height: calc(100vh - 48px - 53px - 47px); /* viewport minus topbar+tabs */
}

/* Queue (left pane) */
.qq-queue {
  border-right: 0.5px solid var(--hairline);
  display: flex;
  flex-direction: column;
  background: white;
  overflow: hidden;
}
.qq-queue-head {
  padding: 14px 20px 10px;
  font-size: 12px;
  color: var(--text-4);
  display: flex;
  justify-content: space-between;
  flex-shrink: 0;
}
.qq-queue-head span:last-child { cursor: pointer; }
.qq-queue-list {
  flex: 1;
  overflow-y: auto;
}
.qq-row {
  padding: 14px 20px;
  border-top: 0.5px solid var(--cream-3);
  cursor: pointer;
  position: relative;
  transition: background 0.1s;
}
.qq-row:hover:not(.active) { background: var(--cream-2); }
.qq-row.active { background: var(--coral-soft); }
.qq-row.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--coral);
}
.qq-row-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
  font-size: 12px;
}
.qq-row-name { color: var(--text); font-weight: 500; }
.qq-row-time { color: var(--text-4); }
.qq-row-product { font-size: 12px; color: var(--text-3); margin-bottom: 6px; }
.qq-row-q {
  font-size: 13px;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.qq-row-foot {
  display: flex;
  gap: 14px;
  font-size: 11px;
  color: var(--text-4);
  align-items: center;
}
.qq-flag-tag { color: var(--red); font-weight: 500; }
.qq-pri {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--coral);
  display: inline-block;
  margin-right: 4px;
}

/* Status pills (shown on the "All" tab where mixed statuses exist) */
.qq-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 9px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  letter-spacing: 0.1px;
  margin-left: auto;
}
.qq-status-pill.pending {
  background: #FFF4D6;
  color: #856404;
}
.qq-status-pill.flagged {
  background: var(--red-soft);
  color: #A32D2D;
}
.qq-status-pill.answered {
  background: var(--green-soft);
  color: #3B6D11;
}
.qq-status-pill.rejected {
  background: var(--cream-3);
  color: var(--text-3);
}
/* In the row footer, push the pill to the far right */
.qq-row-foot { display: flex; align-items: center; gap: 14px; }
.qq-row-foot .qq-status-pill { margin-left: auto; }
.qq-page-foot {
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-4);
  border-top: 0.5px solid var(--cream-3);
  flex-shrink: 0;
}
.qq-page-foot span { cursor: pointer; }

/* Conversation pane (right) */
.qq-conv {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--cream);
}
.qq-conv-head {
  padding: 18px 24px;
  border-bottom: 0.5px solid var(--hairline);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  background: white;
  flex-shrink: 0;
}
.qq-conv-product { font-size: 13px; color: var(--text-3); margin-bottom: 4px; }
.qq-conv-product b { color: var(--text); font-weight: 500; }
.qq-conv-status { font-size: 12px; color: var(--text-3); }
.qq-conv-status.warn { color: var(--red); }
.qq-conv-meta-actions {
  display: flex;
  gap: 14px;
  font-size: 12px;
  color: var(--text-3);
  align-items: center;
}
.qq-conv-meta-actions span { cursor: pointer; }
.qq-conv-meta-actions span:hover { color: var(--text); }
.qq-conv-link { color: var(--coral); cursor: pointer; }

.qq-conv-body {
  padding: 24px;
  flex: 1;
  overflow-y: auto;
}

.qq-msg {
  display: flex;
  gap: 14px;
  margin-bottom: 22px;
  position: relative;
}
.qq-msg:hover .qq-hover-actions { opacity: 1; }
.qq-msg-asked { opacity: 0.7; }

.qq-av {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--cream-3);
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
  flex-shrink: 0;
}

.qq-msg-body { flex: 1; min-width: 0; }
.qq-msg-meta {
  font-size: 13px;
  margin-bottom: 8px;
  color: var(--text-4);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
}
.qq-msg-meta b {
  color: var(--text);
  font-weight: 500;
  margin-right: 6px;
}
.qq-msg-role {
  color: var(--text-3);
  font-size: 12px;
  margin: 0 6px;
}
.qq-msg-role-staff {
  color: var(--coral-text);
  font-size: 12px;
  margin: 0 6px;
  font-weight: 500;
}
.qq-msg-role-buyer {
  color: #3B6D11;
  font-size: 12px;
  margin: 0 6px;
  font-weight: 500;
}
.qq-best-tag {
  color: var(--gold-text);
  font-size: 11px;
  margin-left: auto;
  font-weight: 500;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.qq-msg-text {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
}
.qq-msg-foot {
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-4);
  display: flex;
  gap: 14px;
  align-items: center;
}
.qq-msg-foot span { cursor: pointer; }
.qq-msg-foot span:hover { color: var(--text); }
.qq-hover-actions {
  opacity: 0;
  transition: opacity 0.15s;
  display: flex;
  gap: 12px;
}
.qq-hover-actions span:hover { color: var(--text); }
.qq-hover-actions .danger:hover { color: var(--red); }

.qq-msg-best {
  padding-left: 14px;
  border-left: 2px solid var(--gold);
  margin-left: -16px;
}
.qq-msg-best .qq-av {
  background: var(--gold-soft);
  color: var(--gold-text);
}

.qq-followup {
  margin-left: 50px;
  padding-left: 18px;
  border-left: 1px solid var(--cream-3);
}
.qq-thread-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 18px;
  padding-left: 50px;
  font-size: 11px;
  color: var(--text-4);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.qq-thread-divider::after {
  content: '';
  flex: 1;
  height: 0.5px;
  background: var(--cream-3);
}
.qq-section-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 8px 0 22px;
  font-size: 11px;
  color: var(--text-4);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.qq-section-divider::before, .qq-section-divider::after {
  content: '';
  flex: 1;
  height: 0.5px;
  background: var(--cream-3);
}

/* Composer */
.qq-composer {
  border-top: 0.5px solid var(--hairline);
  background: var(--cream-2);
  padding: 18px 24px;
  flex-shrink: 0;
}
.qq-composer-card {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  padding: 14px 16px 12px;
}
.qq-textarea {
  width: 100%;
  min-height: 70px;
  padding: 0;
  border: none;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  background: transparent;
  color: var(--text);
  line-height: 1.6;
  outline: none;
}
.qq-textarea::placeholder { color: var(--text-4); }
.qq-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 0.5px solid var(--cream-3);
}
.qq-bar-left {
  display: flex;
  gap: 18px;
  font-size: 12px;
  color: var(--text-3);
}
.qq-bar-left span { cursor: pointer; }
.qq-bar-left span:hover { color: var(--text); }
.qq-bar-right {
  display: flex;
  gap: 10px;
  align-items: center;
}
.qq-shortcut {
  font-size: 11px;
  color: var(--text-4);
  margin-right: 4px;
}

/* Buttons */
.btn {
  border: none;
  border-radius: var(--r-md);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-primary {
  padding: 9px 22px;
  font-weight: 500;
  background: var(--coral);
  color: white;
  box-shadow: var(--shadow-sm);
}
.btn-primary:hover { background: var(--coral-hover); }
.btn-primary:disabled { background: #F0BFAF; cursor: not-allowed; box-shadow: none; }
.btn-secondary {
  padding: 9px 16px;
  background: white;
  color: var(--text-2);
  border: 0.5px solid var(--hairline);
}
.btn-secondary:hover { color: var(--text); border-color: #D4CCC2; }
.btn-ghost {
  padding: 9px 16px;
  background: transparent;
  color: var(--text-3);
}
.btn-ghost:hover { color: var(--text); }
.btn-danger-ghost {
  padding: 9px 16px;
  background: white;
  color: var(--text-2);
  border: 0.5px solid var(--hairline);
}
.btn-danger-ghost:hover { color: var(--red); border-color: var(--red); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-add {
  padding: 7px 16px;
  font-weight: 500;
  background: var(--coral);
  color: white;
  border-radius: var(--r-md);
  border: none;
  font-size: 13px;
  box-shadow: var(--shadow-sm);
}
.btn-add:hover { background: var(--coral-hover); }

/* Action bar (for review states) */
.qq-action-bar {
  border-top: 0.5px solid var(--hairline);
  background: var(--cream-2);
  padding: 18px 24px;
  flex-shrink: 0;
}
.qq-action-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.qq-action-info { font-size: 13px; color: var(--text-2); }
.qq-action-info b { color: var(--text); font-weight: 500; }
.qq-action-buttons {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* Pending answer card */
.qq-pending-card {
  margin-left: 50px;
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  padding: 16px 18px;
}
.qq-pending-text {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 14px;
}
.qq-pending-meta {
  display: flex;
  gap: 16px;
  font-size: 12px;
  color: var(--text-3);
  padding-top: 12px;
  border-top: 0.5px solid var(--cream-3);
  flex-wrap: wrap;
}
.qq-pending-meta b { color: var(--text); font-weight: 500; }

/* ============================================
   FLAGGED STATE
============================================ */
.qq-flag-banner {
  background: var(--red-soft-2);
  border-bottom: 0.5px solid #F5DCD5;
  padding: 16px 24px;
}
.qq-flag-banner-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.qq-flag-banner-title {
  font-size: 13px;
  font-weight: 500;
  color: #8A2D1F;
  display: flex;
  align-items: center;
  gap: 8px;
}
.qq-flag-icon {
  width: 20px;
  height: 20px;
  border-radius: var(--r-md);
  background: var(--red);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
}
.qq-flag-banner-meta { font-size: 12px; color: var(--text-3); }
.qq-flag-list { display: flex; flex-direction: column; gap: 6px; }
.qq-flag-item {
  display: flex;
  gap: 10px;
  font-size: 12px;
  color: var(--text-2);
  align-items: baseline;
}
.qq-flag-reason { color: var(--text); font-weight: 500; min-width: 130px; }
.qq-flag-reporter { color: var(--text-3); }
.qq-flag-time { color: var(--text-4); margin-left: auto; }
.qq-flagged-box {
  border-left: 2px solid var(--red);
  background: var(--red-soft-2);
  padding: 14px 16px;
  border-radius: 0 var(--r-md) var(--r-md) 0;
}

/* ============================================
   EMPTY STATE
============================================ */
.qq-empty-queue {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 30px;
  text-align: center;
}
.qq-empty-mark {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: var(--coral-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 18px;
  font-size: 26px;
}
.qq-empty-title {
  font-size: 17px;
  font-weight: 500;
  color: var(--text);
  margin: 0 0 8px;
}
.qq-empty-desc {
  font-size: 13px;
  color: var(--text-3);
  line-height: 1.55;
  margin: 0 0 20px;
  max-width: 280px;
}
.qq-empty-stats {
  display: flex;
  gap: 24px;
  padding-top: 20px;
  border-top: 0.5px solid var(--cream-3);
  width: 100%;
  max-width: 280px;
  justify-content: center;
}
.qq-empty-stat { text-align: center; }
.qq-empty-stat-num {
  font-size: 18px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 2px;
}
.qq-empty-stat-label {
  font-size: 11px;
  color: var(--text-3);
}
.qq-conv-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  text-align: center;
  flex: 1;
  background: var(--cream);
}
.qq-conv-empty-art {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--coral-soft) 0%, var(--coral-soft-2) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 28px;
  font-size: 48px;
}
.qq-conv-empty-title {
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
  margin: 0 0 10px;
}
.qq-conv-empty-desc {
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.6;
  margin: 0 0 28px;
  max-width: 380px;
}
.qq-conv-empty-tip {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  padding: 18px 22px;
  max-width: 420px;

/* ============================================
   SETTINGS PAGE
============================================ */
.settings-body {
  display: grid;
  grid-template-columns: 220px 1fr;

}
.settings-sidebar {

}

}
.settings-tab {

}
.settings-tab:hover:not(.active) { background: var(--cream-2); }
.settings-tab.active {

}
.settings-content {
  padding: 32px 40px 100px;
  max-width: 760px;
  position: relative;
}
.settings-page-title {
  font-size: 22px;
  font-weight: 500;
  color: var(--text);
  margin: 0 0 6px;
}
.settings-page-sub {
  font-size: 14px;
  color: var(--text-3);
  margin: 0 0 32px;
  line-height: 1.5;
}
.settings-card {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  padding: 24px 26px;
  margin-bottom: 20px;
}
.settings-card-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  margin: 0 0 4px;
}
.settings-card-desc {
  font-size: 13px;
  color: var(--text-3);
  margin: 0 0 20px;
  line-height: 1.5;
}
.settings-field {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;

}
.settings-field:first-of-type { border-top: none; padding-top: 0; }
.settings-field-info { flex: 1; }
.settings-field-label {
  font-size: 14px;
  color: var(--text);

}
.settings-field-help {

  color: var(--text-3);

}
.settings-field-control {
  flex-shrink: 0;
  min-width: 200px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

.toggle {
  position: relative;
  width: 38px;
  height: 22px;
  background: #E8E2DA;
  border-radius: 11px;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}
.toggle.on { background: var(--coral); }
.toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: white;
  transition: left 0.2s;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.toggle.on::after { left: 18px; }

.select {
  padding: 7px 10px;
  font-size: 13px;
  border-radius: var(--r-md);
  border: 0.5px solid var(--hairline);

}
.input {

  color: var(--text);

  text-align: right;
  outline: none;
}
.input:focus, .select:focus { border-color: var(--coral); }
.input-wrap {

  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-3);
}

.savebar {

}
.savebar-msg { font-size: 13px; color: var(--text-3); }
.savebar-msg b { color: var(--text); font-weight: 500; }
.savebar-actions { display: flex; gap: 10px; }

}
.analytics-greeting {

}
.analytics-title {

}
.analytics-sub {
  font-size: 14px;
  color: var(--text-3);

}
.analytics-sub b { color: var(--text); font-weight: 500; }
.analytics-section-label {

.analytics-stat-row {

.analytics-callout {

}
.analytics-callout-body { flex: 1; }
.analytics-callout-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);

}
.analytics-callout-desc {
  font-size: 13px;

}
.analytics-callout-link {

}
.analytics-section { margin-bottom: 48px; }
.analytics-card {
  background: white;
  border: 0.5px solid var(--hairline);
  border-radius: var(--r-md);
  padding: 24px 26px;
}
.analytics-card-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 18px;
}
.analytics-card-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);

}
.analytics-card-sub {
  font-size: 12px;
  color: var(--text-3);
}
.analytics-list { display: flex; flex-direction: column; }
.analytics-list-row {
  display: flex;

  border-top: 0.5px solid var(--cream-3);

.analytics-list-row:first-child { border-top: none; padding-top: 0; }
.analytics-list-rank { color: var(--text-4); font-size: 12px; min-width: 18px; }
.analytics-list-name { flex: 1; color: var(--text); }
.analytics-list-bar-wrap {

}
.analytics-list-bar {

}
.analytics-chart {

.analytics-chart-x {

}
.analytics-q-list-item {

  border-top: 0.5px solid var(--cream-3);
}
.analytics-q-list-item:first-child { border-top: none; padding-top: 0; }
.analytics-q-text {
  font-size: 13px;
  color: var(--text);
